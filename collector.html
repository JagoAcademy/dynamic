<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collector Portal - AVIANDO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center">
  <div class="w-full max-w-md bg-white min-h-screen shadow-2xl relative pb-20">
    
    <div class="bg-gradient-to-br from-[#0B1B3D] to-[#163063] px-6 pt-10 pb-6 rounded-b-[2rem] shadow-lg text-white">
      <div class="flex justify-between items-center mb-2">
        <h1 class="text-xl font-black tracking-tight text-orange-400">COLLECTOR PORTAL</h1>
        <button onclick="logout()" class="bg-red-500/20 text-red-100 text-xs font-bold px-3 py-1.5 rounded-full border border-red-400/30">LOGOUT</button>
      </div>
      <p class="text-slate-300 text-sm font-medium" id="welcomeCollector">Halo, Collector!</p>
    </div>

    <div class="p-6 space-y-6">
      <!-- Target Progress -->
      <div>
         <h2 class="text-xs font-black text-slate-800 uppercase mb-2">Target Anda Bulan Ini</h2>
         <div class="w-full bg-slate-200 rounded-full h-4 mb-1">
            <div class="bg-orange-500 h-4 rounded-full" style="width: 0%" id="progress-bar"></div>
         </div>
         <p class="text-xs text-slate-500 font-semibold text-right" id="progress-text">Menghitung...</p>
      </div>

      <!-- Daftar Tugas Dinamis -->
      <div>
         <h2 class="text-xs font-black text-slate-800 uppercase mb-3">Daftar Tugas Penagihan</h2>
         <div id="task-list">
             <p class="text-xs text-slate-500 text-center py-4">Memuat data tugas dari server...</p>
         </div>
      </div>

      <!-- Form Log Aktivitas -->
      <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 shadow-sm">
         <h2 class="text-sm font-black text-[#0B1B3D] uppercase mb-3">Log Aktivitas</h2>
         <form id="formLogAktivitas" class="space-y-3">
             <select id="select_debitur" required class="w-full border border-slate-200 rounded-lg px-3 py-3 text-sm focus:ring-2 focus:ring-orange-500">
                 <option value="">Memuat Debitur...</option>
             </select>
             <select id="hasil_tindak_lanjut" required class="w-full border border-slate-200 rounded-lg px-3 py-3 text-sm focus:ring-2 focus:ring-orange-500">
                 <option value="Tersambung & Janji Bayar">Tersambung & Janji Bayar</option>
                 <option value="Nomor Tidak Aktif">Nomor Tidak Aktif</option>
                 <option value="Rumah Kosong">Rumah Kosong / Tidak Bertemu</option>
                 <option value="Menolak Bayar">Menolak Membayar</option>
             </select>
             <input type="date" id="tgl_janji" title="Tanggal Janji Bayar (Opsional)" class="w-full border border-slate-200 rounded-lg px-3 py-3 text-sm focus:ring-2 focus:ring-orange-500">
             <textarea id="catatan" required placeholder="Catatan hasil telepon / kunjungan lapangan..." class="w-full border border-slate-200 rounded-lg px-3 py-3 text-sm focus:ring-2 focus:ring-orange-500 h-24"></textarea>
             <button type="submit" class="w-full bg-[#E65C00] text-white font-bold text-sm py-3 rounded-xl mt-2 active:scale-95 transition-transform">Simpan Laporan</button>
         </form>
      </div>

    </div>
  </div>
  <script type="module" src="/src/collector.js"></script>
</body>
</html>
