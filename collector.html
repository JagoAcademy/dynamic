<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collector Portal - AVIANDO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center">
  <div class="w-full max-w-md bg-white min-h-screen shadow-2xl relative pb-20">
    <div class="bg-gradient-to-br from-[#0B1B3D] to-[#163063] px-6 pt-10 pb-6 rounded-b-[2rem] shadow-lg text-white">
      <div class="flex justify-between items-center mb-2">
        <h1 class="text-xl font-black tracking-tight text-orange-400">COLLECTOR PORTAL</h1>
        <button onclick="logout()" class="bg-red-500/20 text-red-100 text-xs font-bold px-3 py-1.5 rounded-full border border-red-400/30">LOGOUT</button>
      </div>
      <p class="text-slate-300 text-sm font-medium" id="welcomeCollector">Halo, Collector!</p>
      <div class="mt-4 bg-white/10 p-3 rounded-xl border border-white/20">
         <p class="text-xs font-bold uppercase">Tugas Hari Ini</p>
         <p class="text-sm">📞 15 Telepon | 📍 5 Kunjungan</p>
      </div>
    </div>
    <div class="p-6 space-y-6">
      <div>
         <h2 class="text-xs font-black text-slate-800 uppercase mb-2">Target Anda Bulan Ini</h2>
         <div class="w-full bg-slate-200 rounded-full h-4 mb-1">
            <div class="bg-orange-500 h-4 rounded-full" style="width: 70%"></div>
         </div>
         <p class="text-xs text-slate-500 font-semibold text-right">70% (Rp 35.000.000 / Rp 50.000.000)</p>
      </div>
      <div>
         <h2 class="text-xs font-black text-slate-800 uppercase mb-3">Daftar Tugas Penagihan</h2>
         <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
             <h3 class="font-bold text-[#0B1B3D] text-[15px] uppercase">Budi Santoso</h3>
             <p class="text-xs text-slate-500 font-medium mb-3">Tunggakan: <span class="text-red-500 font-bold">Rp 5.000.000</span> | JT: 25 Sep 2026</p>
             <div class="flex gap-2">
                 <button class="flex-1 bg-green-500 text-white text-[11px] font-bold py-2 rounded-lg">📞 Hubungi WA</button>
                 <button class="flex-1 bg-blue-100 text-blue-700 text-[11px] font-bold py-2 rounded-lg">📍 Lihat Alamat</button>
             </div>
         </div>
      </div>
      <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 shadow-sm">
         <h2 class="text-sm font-black text-[#0B1B3D] uppercase mb-3">Log Aktivitas</h2>
         <form id="formLogAktivitas" class="space-y-3">
             <select id="select_debitur" class="w-full border border-slate-200 rounded-lg px-3 py-3 text-sm focus:ring-2 focus:ring-orange-500">
                 <option value="test-id">Pilih Debitur (Budi Santoso)</option>
             </select>
             <select id="hasil_tindak_lanjut" class="w-full border border-slate-200 rounded-lg px-3 py-3 text-sm focus:ring-2 focus:ring-orange-500">
                 <option value="Tersambung & Janji Bayar">Tersambung & Janji Bayar</option>
                 <option value="Nomor Tidak Aktif">Nomor Tidak Aktif</option>
                 <option value="Rumah Kosong">Rumah Kosong / Tidak Bertemu</option>
             </select>
             <input type="date" title="Tanggal Janji Bayar" class="w-full border border-slate-200 rounded-lg px-3 py-3 text-sm focus:ring-2 focus:ring-orange-500">
             <textarea id="catatan" placeholder="Catatan hasil telepon / kunjungan lapangan..." class="w-full border border-slate-200 rounded-lg px-3 py-3 text-sm focus:ring-2 focus:ring-orange-500 h-24"></textarea>
             <button type="submit" class="w-full bg-[#E65C00] text-white font-bold text-sm py-3 rounded-xl mt-2">Simpan Laporan</button>
         </form>
      </div>
    </div>
  </div>
  <script type="module" src="/src/collector.js"></script>
</body>
</html>
