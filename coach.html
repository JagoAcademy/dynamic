<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coach Dashboard - Tirta Nirwana</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Tema Tab Oranye */
    .tab-active { border-bottom: 4px solid #E65C00; color: #E65C00; font-weight: 700; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center">

  <div class="w-full max-w-md bg-white min-h-screen shadow-2xl relative pb-20">
    
    <!-- Header Coach (Gradasi Oranye Khas Tirta Nirwana) -->
    <div class="bg-gradient-to-br from-[#E65C00] to-[#E67E22] px-6 pt-10 pb-6 rounded-b-[2rem] shadow-lg text-white">
      <div class="flex justify-between items-center mb-2">
        <h1 class="text-2xl font-black tracking-tight drop-shadow-sm">COACH PANEL</h1>
        <button onclick="logout()" class="bg-red-500/80 text-white text-xs font-bold px-3 py-1.5 rounded-full border border-white/30 active:scale-95 shadow-sm">LOGOUT</button>
      </div>
      <p class="text-orange-100 text-sm font-medium" id="welcomeText">Halo, Coach!</p>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex justify-around bg-white border-b border-slate-200 mt-2 px-2 sticky top-0 z-50 shadow-sm">
      <button onclick="switchTab('siswa')" id="tab-siswa" class="tab-active flex-1 py-4 text-sm text-slate-500 font-semibold transition-all">🏊 Siswa</button>
      <button onclick="switchTab('jadwal')" id="tab-jadwal" class="flex-1 py-4 text-sm text-slate-500 font-semibold transition-all">⏱️ Jadwal</button>
      <button onclick="switchTab('event')" id="tab-event" class="flex-1 py-4 text-sm text-slate-500 font-semibold transition-all">📅 Event</button>
    </div>

    <!-- CONTENT: TAB MASTER SISWA (Di Sini Input Siswanya Bray!) -->
    <div id="content-siswa" class="p-6">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-2xl">📝</span>
        <h2 class="text-sm font-black text-[#0B1B3D] uppercase tracking-wide">Tambah Master Siswa</h2>
      </div>
      <form id="formSiswa" class="space-y-4 bg-orange-50/50 p-5 rounded-2xl border border-orange-100 shadow-sm">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">NAMA LENGKAP</label>
          <input type="text" id="s_nama" required class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none transition-all">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">TGL LAHIR</label>
            <input type="date" id="s_tgl" required class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none transition-all">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">KELOMPOK UMUR</label>
            <select id="s_ku" required class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none transition-colors">
              <option value="Pra-KU (< 8 th)">Pra-KU (&lt; 8 Thn)</option>
              <option value="KU V (8-9 th)">KU V (8-9 Thn)</option>
              <option value="KU IV (10-11 th)">KU IV (10-11 Thn)</option>
              <option value="KU III (12-13 th)">KU III (12-13 Thn)</option>
              <option value="KU II (14-15 th)">KU II (14-15 Thn)</option>
              <option value="KU I (16 th)">KU I (16 Thn)</option>
              <option value="Senior (17+ th)">Senior (17+ Thn)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">NOMOR WA (Contoh: 62812...)</label>
          <input type="number" id="s_wa" required class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none transition-all">
        </div>
        <!-- Tombol submit diganti warna Navy agar kontras -->
        <button type="submit" class="w-full bg-[#0B1B3D] text-white font-bold text-sm py-3 rounded-xl mt-2 active:scale-95 transition-all shadow-md">Simpan Data Siswa</button>
      </form>
    </div>

    <!-- CONTENT: TAB JADWAL LATIHAN -->
    <div id="content-jadwal" class="p-6 hidden">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-2xl">📋</span>
        <h2 class="text-sm font-black text-[#0B1B3D] uppercase tracking-wide">Input Jadwal Latihan</h2>
      </div>
      <form id="formJadwal" class="space-y-4 bg-orange-50/50 p-5 rounded-2xl border border-orange-100 shadow-sm">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">NAMA KOLAM</label>
          <input type="text" id="j_kolam" required class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">TANGGAL</label>
            <input type="date" id="j_tgl" required class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">HARI</label>
            <select id="j_hari" required class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
              <option value="Senin">Senin</option><option value="Selasa">Selasa</option>
              <option value="Rabu">Rabu</option><option value="Kamis">Kamis</option>
              <option value="Jumat">Jumat</option><option value="Sabtu">Sabtu</option>
              <option value="Minggu">Minggu</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">JAM (Misal: 15:30)</label>
            <input type="time" id="j_jam" required class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">JUDUL LATIHAN</label>
            <input type="text" id="j_judul" placeholder="Endurance/Sprint" required class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
          </div>
        </div>
        <button type="submit" class="w-full bg-[#0B1B3D] text-white font-bold text-sm py-3 rounded-xl mt-2 active:scale-95 transition-all shadow-md">Simpan Jadwal</button>
      </form>
    </div>

    <!-- CONTENT: TAB EVENT -->
    <div id="content-event" class="p-6 hidden">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-2xl">🏆</span>
        <h2 class="text-sm font-black text-[#0B1B3D] uppercase tracking-wide">Buat Kalender Event</h2>
      </div>
      <form id="formEvent" class="space-y-4 bg-orange-50/50 p-5 rounded-2xl border border-orange-100 shadow-sm">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">NAMA EVENT KAJI / LOMBA</label>
          <input type="text" id="e_nama" required class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">UPLOAD POSTER EVENT</label>
          <input type="file" id="e_file" accept="image/*" required class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-orange-100 file:text-orange-700 hover:file:bg-orange-200 cursor-pointer">
        </div>
        <button type="submit" id="btnEvent" class="w-full bg-[#0B1B3D] text-white font-bold text-sm py-3 rounded-xl mt-2 active:scale-95 transition-all shadow-md">Upload & Simpan Event</button>
      </form>
    </div>

  </div>

  <!-- SCRIPT LOGIKA DASHBOARD & SUPABASE (VANILLA) -->
  <script type="module">
    import { supabase } from '/src/supabase.js';

    // 1. PROTEKSI HALAMAN (BUG FIX: Disesuaikan dengan session login portal global)
    if (localStorage.getItem('logged_in') !== 'true' || localStorage.getItem('user_role') !== 'coach') {
      window.location.href = 'login.html'; 
    } else {
      document.getElementById('welcomeText').innerText = `Semangat melatih, Coach ${localStorage.getItem('user_name')}!`;
    }

    // 2. Fungsi Logout
    window.logout = function() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    // 3. Fungsi Pindah Tab
    window.switchTab = function(tabName) {
      document.getElementById('content-siswa').classList.add('hidden');
      document.getElementById('content-jadwal').classList.add('hidden');
      document.getElementById('content-event').classList.add('hidden');
      
      document.getElementById(`content-${tabName}`).classList.remove('hidden');

      document.getElementById('tab-siswa').classList.remove('tab-active');
      document.getElementById('tab-jadwal').classList.remove('tab-active');
      document.getElementById('tab-event').classList.remove('tab-active');
      
      document.getElementById(`tab-${tabName}`).classList.add('tab-active');
    }

    // ========================================================
    // AUTO-HITUNG KELOMPOK UMUR (KU)
    // ========================================================
    document.getElementById('s_tgl').addEventListener('change', function() {
      const tglLahir = this.value;
      if (!tglLahir) return;
      
      const birthDate = new Date(tglLahir);
      const today = new Date();
      
      let age = today.getFullYear() - birthDate.getFullYear();
      const m = today.getMonth() - birthDate.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
          age--;
      }
      
      const selectKu = document.getElementById('s_ku');
      
      if (age < 8) selectKu.value = "Pra-KU (< 8 th)";
      else if (age <= 9) selectKu.value = "KU V (8-9 th)";
      else if (age <= 11) selectKu.value = "KU IV (10-11 th)";
      else if (age <= 13) selectKu.value = "KU III (12-13 th)";
      else if (age <= 15) selectKu.value = "KU II (14-15 th)";
      else if (age <= 16) selectKu.value = "KU I (16 th)";
      else selectKu.value = "Senior (17+ th)";
      
      selectKu.classList.add('bg-orange-100', 'border-orange-300');
      setTimeout(() => selectKu.classList.remove('bg-orange-100', 'border-orange-300'), 1000);
    });

    // 4. Submit Form: Master Siswa (Sesuai SQL Schema kamu)
    document.getElementById('formSiswa').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button'); 
      const originalText = btn.innerText;
      btn.innerText = "Menyimpan...";
      
      const { error } = await supabase.from('siswa').insert([{
        nama_lengkap: document.getElementById('s_nama').value,
        tanggal_lahir: document.getElementById('s_tgl').value,
        kelompok_umur: document.getElementById('s_ku').value,
        no_wa: document.getElementById('s_wa').value
      }]);

      if(error) alert("Gagal nyimpen: " + error.message);
      else { alert("✅ Data Siswa Berhasil Disimpan!"); e.target.reset(); }
      btn.innerText = originalText;
    });

    // 5. Submit Form: Jadwal Latihan
    document.getElementById('formJadwal').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button'); 
      const originalText = btn.innerText;
      btn.innerText = "Menyimpan...";

      const { error } = await supabase.from('jadwal_latihan').insert([{
        nama_kolam: document.getElementById('j_kolam').value,
        tanggal: document.getElementById('j_tgl').value,
        hari: document.getElementById('j_hari').value,
        jam: document.getElementById('j_jam').value,
        judul_latihan: document.getElementById('j_judul').value
      }]);

      if(error) alert("Gagal nyimpen: " + error.message);
      else { alert("✅ Jadwal Latihan Berhasil Disimpan!"); e.target.reset(); }
      btn.innerText = originalText;
    });

    // 6. Submit Form: Event
    document.getElementById('formEvent').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnEvent');
      btn.innerText = "Mengupload Gambar... (Tunggu ya)";
      btn.classList.add('opacity-50');

      const fileInput = document.getElementById('e_file');
      const file = fileInput.files[0];
      
      if (!file) return alert("Pilih gambar dulu!");

      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}.${fileExt}`;

      try {
        const { data: uploadData, error: uploadError } = await supabase.storage
          .from('event_images')
          .upload(fileName, file);

        if (uploadError) throw uploadError;

        const { data: urlData } = supabase.storage
          .from('event_images')
          .getPublicUrl(fileName);

        btn.innerText = "Menyimpan ke Database...";

        const { error: dbError } = await supabase.from('kalender_event').insert([{
          nama_event: document.getElementById('e_nama').value,
          image_url: urlData.publicUrl
        }]);

        if (dbError) throw dbError;

        alert("✅ Event & Poster Berhasil Diupload!");
        e.target.reset();

      } catch (err) {
        alert("Waduh, gagal Bro: " + err.message);
      } finally {
        btn.innerText = "Upload & Simpan Event";
        btn.classList.remove('opacity-50');
      }
    });
  </script>
</body>
</html>
