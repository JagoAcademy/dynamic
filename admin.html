<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - AVIANDO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .tab-active { border-bottom: 4px solid #E65C00; color: #E65C00; font-weight: 700; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  
  <!-- HEADER FULL WIDTH -->
  <nav class="w-full bg-gradient-to-r from-[#0B1B3D] to-[#163063] px-6 lg:px-12 py-5 shadow-lg text-white sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <img src="/images/logo.png" class="w-10 h-10 lg:w-12 lg:h-12 bg-white p-1.5 rounded-full shadow-md object-contain">
      <div>
        <h1 class="text-lg lg:text-xl font-black tracking-tight text-orange-400 uppercase">Admin Portal</h1>
        <p class="text-slate-300 text-[11px] lg:text-xs font-medium" id="welcomeAdmin">Halo, Admin!</p>
      </div>
    </div>
    <button onclick="logout()" class="bg-red-500/20 text-red-100 text-xs font-bold px-4 py-2 rounded-full border border-red-400/30 hover:bg-red-500 hover:text-white transition-all active:scale-95">LOGOUT</button>
  </nav>

  <!-- NAVIGATION TABS FULL WIDTH -->
  <div class="w-full bg-white border-b border-slate-200 sticky top-[76px] lg:top-[88px] z-40 shadow-sm">
    <div class="max-w-7xl mx-auto flex px-4">
      <button onclick="switchTab('akun')" id="tab-akun" class="tab-active py-4 px-6 text-sm text-slate-500 font-semibold transition-all hover:text-orange-600">👥 Kelola Akun</button>
      <button onclick="switchTab('debitur')" id="tab-debitur" class="py-4 px-6 text-sm text-slate-500 font-semibold transition-all hover:text-orange-600">📁 Manajemen Debitur</button>
    </div>
  </div>

  <!-- MAIN WORKSPACE -->
  <main class="max-w-7xl mx-auto p-6 lg:p-10 w-full">
    
    <!-- TAB 1: KELOLA AKUN -->
    <div id="content-akun" class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
      <div class="bg-white p-6 lg:p-8 rounded-2xl border border-slate-200 shadow-sm">
        <div class="flex items-center gap-3 mb-6">
            <span class="text-3xl">📋</span>
            <h2 class="text-sm font-black text-[#0B1B3D] uppercase tracking-wide">Buat Akun Collector</h2>
        </div>
        <form id="formCollector" class="space-y-4">
          <input type="text" id="c_user" required placeholder="Username Collector (Email)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
          <input type="password" id="c_pass" required placeholder="Password Akun" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
          <button type="submit" class="w-full bg-[#E65C00] text-white font-bold text-sm py-4 rounded-xl mt-2 active:scale-95 transition-all hover:bg-orange-600 shadow-md">Simpan Akun Collector</button>
        </form>
      </div>
    </div>

    <!-- TAB 2: MANAJEMEN DEBITUR -->
    <div id="content-debitur" class="hidden">
      <div id="editContainer" class="hidden mb-8 bg-orange-50 p-6 lg:p-8 rounded-2xl border border-orange-200 shadow-sm">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-sm font-black text-orange-900 uppercase">Input / Edit Data Debitur</h2>
            <button onclick="batalEdit()" class="text-xs font-bold text-red-500 bg-red-100 px-4 py-2 rounded-lg hover:bg-red-200 transition-colors">Batal</button>
        </div>
        <form id="formEditDebitur" class="space-y-4">
          <input type="hidden" id="edit_id">
          <input type="text" id="edit_nama" required placeholder="Nama Lengkap Debitur" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="date" id="edit_tgl" required title="Tanggal Jatuh Tempo" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
            <select id="edit_kategori" required class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
              <option value="Lancar">Lancar</option>
              <option value="Kurang Lancar">Kurang Lancar</option>
              <option value="Diragukan">Diragukan</option>
              <option value="Macet">Macet</option>
            </select>
          </div>
          <input type="number" id="edit_wa" required placeholder="Nomor WA (628...)" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
          <button type="submit" class="w-full bg-[#E65C00] text-white font-bold text-sm py-4 rounded-xl mt-2 active:scale-95 transition-all hover:bg-orange-600 shadow-md">Simpan Data Debitur</button>
        </form>
      </div>

      <div class="flex justify-between items-center mb-4">
        <h2 class="text-sm font-black text-slate-800 uppercase">Daftar Kasus Debitur</h2>
      </div>
      
      <!-- Di PC, card berjejer 3 kolom -->
      <div id="admin-debitur-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <p class="text-sm text-slate-500 py-4 col-span-full">Memuat data database...</p>
      </div>
    </div>

  </main>
  <script type="module" src="/src/admin.js"></script>
</body>
</html>
