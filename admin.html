<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - AVIANDO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .tab-active { border-bottom: 4px solid #E65C00; color: #E65C00; font-weight: 700; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen relative">
  
  <!-- HEADER FULL WIDTH -->
  <nav class="w-full bg-gradient-to-r from-[#0B1B3D] to-[#163063] px-6 lg:px-12 py-5 shadow-lg text-white sticky top-0 z-40 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <img src="/images/logo.png" class="w-10 h-10 lg:w-12 lg:h-12 bg-white p-1.5 rounded-full shadow-md object-contain">
      <div>
        <h1 class="text-lg lg:text-xl font-black tracking-tight text-orange-400 uppercase">Admin Portal</h1>
        <p class="text-slate-300 text-[11px] lg:text-xs font-medium" id="welcomeAdmin">Halo, Admin!</p>
      </div>
    </div>
    <button onclick="logout()" class="bg-red-500/20 text-red-100 text-xs font-bold px-4 py-2 rounded-full border border-red-400/30 hover:bg-red-500 hover:text-white transition-all active:scale-95">LOGOUT</button>
  </nav>

  <!-- NAVIGATION TABS FULL WIDTH -->
  <div class="w-full bg-white border-b border-slate-200 sticky top-[76px] lg:top-[88px] z-30 shadow-sm">
    <div class="max-w-7xl mx-auto flex px-4">
      <button onclick="switchTab('akun')" id="tab-akun" class="tab-active py-4 px-6 text-sm text-slate-500 font-semibold transition-all hover:text-orange-600">👥 Kelola Akun</button>
      <button onclick="switchTab('debitur')" id="tab-debitur" class="py-4 px-6 text-sm text-slate-500 font-semibold transition-all hover:text-orange-600">📁 Manajemen Debitur</button>
    </div>
  </div>

  <!-- MAIN WORKSPACE -->
  <main class="max-w-7xl mx-auto p-6 lg:p-10 w-full">
    
    <!-- TAB 1: KELOLA AKUN -->
    <div id="content-akun" class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
      <div class="bg-white p-6 lg:p-8 rounded-2xl border border-slate-200 shadow-sm">
        <div class="flex items-center gap-3 mb-6">
            <span class="text-3xl">📋</span>
            <h2 class="text-sm font-black text-[#0B1B3D] uppercase tracking-wide">Buat Akun Collector</h2>
        </div>
        
        <form id="formCollector" class="space-y-4">
          <input type="text" id="c_name" required placeholder="Nama Lengkap Collector" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
          <input type="text" id="c_user" required placeholder="Username Login" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
          <input type="password" id="c_pass" required placeholder="Password Akun" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
          <input type="number" id="c_phone" placeholder="Nomor HP / WA (Opsional)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
          <button type="submit" class="w-full bg-[#E65C00] text-white font-bold text-sm py-4 rounded-xl mt-2 active:scale-95 transition-all hover:bg-orange-600 shadow-md">Simpan Akun Collector</button>
        </form>
      </div>
    </div>

    <!-- TAB 2: MANAJEMEN DEBITUR (FULL MANUAL + EXCEL POP-UP) -->
    <div id="content-debitur" class="hidden">
      
      <!-- FORM: INPUT MANUAL -->
      <div class="bg-white p-6 lg:p-8 rounded-2xl border border-slate-200 shadow-sm mb-8 transition-all">
        
        <!-- Header Section dengan Tombol Pop-up Excel -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 pb-4 border-b border-slate-100">
            <h2 class="text-sm font-black text-[#0B1B3D] uppercase">Input Data Kasus Baru</h2>
            <button type="button" onclick="openExcelModal()" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 shadow-[0_4px_10px_rgba(22,163,74,0.3)] transition-all active:scale-95">
                <span class="text-lg">📊</span> Upload Excel
            </button>
        </div>

        <form id="formEditDebitur" class="space-y-4">
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Data Inti Wajib -->
            <div class="space-y-4">
              <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Informasi Dasar</h3>
              <input type="text" id="input_client" required placeholder="Nama Perusahaan Klien (Cth: Bank BNI)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
              <input type="text" id="input_nama" required placeholder="Nama Lengkap Debitur" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
              <input type="text" id="input_nik" required placeholder="Nomor ID Akun / NIK" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
              <input type="number" id="input_amount" required placeholder="Total Terutang (Rp)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
              <input type="date" id="input_tgl" required title="Tanggal Jatuh Tempo" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
            </div>

            <!-- Data Elastis JSONB -->
            <div class="space-y-4">
              <div class="flex justify-between items-center mb-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Detail Ekstra (JSON)</h3>
                <button type="button" onclick="addJsonField()" class="text-[11px] font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg hover:bg-blue-100 transition-colors">+ Tambah Detail</button>
              </div>
              
              <div id="jsonb-fields-container" class="space-y-3">
                <div class="flex gap-2 json-row">
                  <input type="text" value="No WhatsApp" readonly class="w-1/3 bg-slate-100 border border-slate-200 text-slate-500 rounded-lg px-3 py-2 text-xs font-semibold">
                  <input type="text" placeholder="6281234..." required class="json-val w-2/3 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500">
                </div>
              </div>
            </div>
          </div>

          <button type="submit" class="w-full bg-[#E65C00] text-white font-bold text-sm py-4 rounded-xl mt-6 active:scale-95 transition-all hover:bg-orange-600 shadow-md">Simpan Data Debitur ke Database</button>
        </form>
      </div>

      <!-- DAFTAR KASUS -->
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-sm font-black text-slate-800 uppercase">Daftar Kasus Debitur Aktif</h2>
      </div>
      <div id="admin-debitur-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <p class="text-sm text-slate-500 py-4 col-span-full">Memuat data database...</p>
      </div>
    </div>

  </main>

  <!-- MODAL / POP-UP UPLOAD EXCEL -->
  <div id="modal-excel" class="fixed inset-0 bg-slate-900/60 z-[100] hidden flex items-center justify-center backdrop-blur-sm transition-opacity px-4">
    <div class="bg-white w-full max-w-md p-6 lg:p-8 rounded-3xl shadow-2xl relative border border-slate-200">
      
      <!-- Tombol Close (X) -->
      <button onclick="closeExcelModal()" class="absolute top-4 right-5 text-slate-400 hover:text-red-500 font-bold text-2xl leading-none transition-colors">&times;</button>
      
      <!-- Modal Header -->
      <div class="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
        <span class="text-4xl drop-shadow-sm">📊</span>
        <div>
          <h2 class="text-sm font-black text-[#0B1B3D] uppercase tracking-wide">Upload Data Massal</h2>
          <p class="text-[11px] text-slate-500 font-medium">Format file: Excel (.xlsx) atau CSV</p>
        </div>
      </div>

      <!-- Form Pop-up -->
      <form id="formUploadExcel" class="space-y-5">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Tanggal Upload</label>
          <input type="text" id="excel_date" readonly class="w-full bg-slate-100 border border-slate-200 text-slate-500 rounded-xl px-4 py-3 text-sm font-bold cursor-not-allowed">
        </div>
        
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Perusahaan Klien</label>
          <input type="text" id="excel_client" required placeholder="Cth: Bank XYZ" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-green-500 transition-all">
        </div>

        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Pilih File Data</label>
          <input type="file" id="excel_file" accept=".xlsx, .xls, .csv" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm text-slate-600 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-green-100 file:text-green-700 hover:file:bg-green-200 cursor-pointer transition-all">
        </div>

        <button type="submit" class="w-full bg-green-600 text-white font-bold text-sm py-4 rounded-xl mt-4 active:scale-95 transition-all hover:bg-green-700 shadow-md flex justify-center items-center gap-2">
          Mulai Proses Upload
        </button>
      </form>

    </div>
  </div>
  
  <script type="module" src="/src/admin.js"></script>
</body>
</html>
