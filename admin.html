<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - AVIANDO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .tab-active { border-bottom: 4px solid #E65C00; color: #E65C00; font-weight: 700; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center">
  <div class="w-full max-w-md md:max-w-2xl lg:max-w-4xl bg-white min-h-screen shadow-2xl relative pb-20 transition-all duration-300">
    <div class="bg-gradient-to-br from-[#0B1B3D] to-[#163063] px-6 md:px-10 pt-10 pb-6 rounded-b-[2rem] shadow-lg text-white">
      <div class="flex justify-between items-center mb-2">
        <h1 class="text-2xl font-black tracking-tight text-orange-400">ADMIN PORTAL</h1>
        <button onclick="logout()" class="bg-red-500/20 text-red-100 text-xs font-bold px-3 py-1.5 rounded-full border border-red-400/30 active:scale-95">LOGOUT</button>
      </div>
      <p class="text-slate-300 text-sm font-medium" id="welcomeAdmin">Halo, Admin!</p>
    </div>
    <div class="flex justify-around bg-white border-b border-slate-200 mt-2 px-2 sticky top-0 z-50 shadow-sm">
      <button onclick="switchTab('akun')" id="tab-akun" class="tab-active flex-1 py-4 text-sm text-slate-500 font-semibold transition-all">👥 Kelola Akun</button>
      <button onclick="switchTab('debitur')" id="tab-debitur" class="flex-1 py-4 text-sm text-slate-500 font-semibold transition-all">📁 Manajemen Data Debitur</button>
    </div>

    <!-- TAB 1: KELOLA AKUN -->
    <div id="content-akun" class="p-6 md:p-10 grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
      <div class="bg-slate-50 p-5 lg:p-8 rounded-2xl border border-slate-200 shadow-sm lg:col-span-2">
        <div class="flex items-center gap-2 mb-4">
            <span class="text-2xl">📋</span>
            <h2 class="text-sm font-black text-[#0B1B3D] uppercase tracking-wide">Buat Akun Collector</h2>
        </div>
        <form id="formCollector" class="space-y-3">
          <input type="text" id="c_user" required placeholder="Username Collector" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
          <input type="password" id="c_pass" required placeholder="Password Collector" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500">
          <button type="submit" class="w-full bg-[#E65C00] text-white font-bold text-sm py-4 rounded-xl mt-2 active:scale-95 transition-all">Simpan Akun Collector</button>
        </form>
      </div>
    </div>

    <!-- TAB 2: MANAJEMEN DEBITUR -->
    <div id="content-debitur" class="p-6 md:p-10 hidden">
      <div id="editContainer" class="hidden mb-6 bg-orange-50 p-5 lg:p-8 rounded-2xl border border-orange-200 shadow-sm">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-sm font-black text-orange-900 uppercase">Input / Edit Data Debitur</h2>
            <button onclick="batalEdit()" class="text-xs font-bold text-red-500 bg-red-100 px-3 py-1.5 rounded">Batal</button>
        </div>
        <form id="formEditDebitur" class="space-y-3">
          <input type="hidden" id="edit_id">
          <input type="text" id="edit_nama" required placeholder="Nama Lengkap Debitur" class="w-full border border-slate-200 rounded-lg px-3 py-3 text-sm focus:ring-2 focus:ring-orange-500">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <input type="date" id="edit_tgl" required title="Tanggal Jatuh Tempo" class="w-full border border-slate-200 rounded-lg px-3 py-3 text-sm focus:ring-2 focus:ring-orange-500">
            <select id="edit_kategori" required class="w-full border border-slate-200 rounded-lg px-3 py-3 text-sm focus:ring-2 focus:ring-orange-500">
              <option value="Lancar">Lancar</option>
              <option value="Kurang Lancar">Kurang Lancar</option>
              <option value="Diragukan">Diragukan</option>
              <option value="Macet">Macet</option>
            </select>
          </div>
          <input type="number" id="edit_wa" required placeholder="Nomor WA (628...)" class="w-full border border-slate-200 rounded-lg px-3 py-3 text-sm focus:ring-2 focus:ring-orange-500">
          <button type="submit" class="w-full bg-[#E65C00] text-white font-bold text-sm py-4 rounded-xl mt-2 active:scale-95 transition-all">Simpan Data Debitur</button>
        </form>
      </div>
      <h2 class="text-sm font-black text-slate-800 uppercase mb-3">Daftar Kasus Debitur</h2>
      <div id="admin-debitur-list" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <p class="text-sm text-slate-500 text-center py-4 lg:col-span-2">Memuat data database...</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/admin.js"></script>
</body>
</html>
