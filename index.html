<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <!-- Meta Viewport untuk Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ACS - Aviando Collector System</title>
  
  <!-- Tailwind CSS dari CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0B1B3D; }
    .bg-gradient-custom {
      background: linear-gradient(135deg, #0B1B3D 0%, #1A3673 100%);
    }
  </style>
</head>
<body class="bg-gradient-custom min-h-screen flex flex-col justify-between text-white selection:bg-[#E65C00] selection:text-white">

  <!-- Bagian Atas: Logo & Judul -->
  <main class="flex-1 flex flex-col items-center justify-center px-6 pt-12 pb-8">
    
    <!-- Wadah Logo (Bisa diklik kembali ke index) -->
    <!-- Menghilangkan bg-white agar background hitam dari logo menyatu, atau gunakan object-fit -->
    <a href="index.html" class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl shadow-xl overflow-hidden mb-6 transition-transform hover:scale-105 active:scale-95 block">
        <!-- Logo fit in penuh -->
        <img src="/images/logo.png" alt="Logo ACS" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150/000000/FFFFFF?text=ACS'">
    </a>

    <!-- Judul Aplikasi -->
    <div class="text-center mb-10">
      <h1 class="text-3xl sm:text-4xl font-black mb-2 tracking-tight">Aviando<br/>Collector System</h1>
      <p class="text-[#E65C00] text-[11px] sm:text-xs font-bold uppercase tracking-[0.2em]">Sistem Penagihan Terpadu</p>
    </div>

    <!-- Badge Fitur (Grid 2 Kolom) -->
    <div class="grid grid-cols-2 gap-3 mb-4 w-full max-w-[320px]">
      <div class="bg-white/10 backdrop-blur-sm border border-white/20 rounded-full py-2 px-3 flex items-center justify-center gap-2 shadow-sm">
        <span class="text-base">⚖️</span>
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-200">Task Assign</span>
      </div>
      <div class="bg-white/10 backdrop-blur-sm border border-white/20 rounded-full py-2 px-3 flex items-center justify-center gap-2 shadow-sm">
        <span class="text-base">⚡</span>
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-200">Fast Update</span>
      </div>
    </div>
    
    <!-- Badge Fitur Tengah -->
    <div class="bg-white/10 backdrop-blur-sm border border-white/20 rounded-full py-2 px-5 flex items-center justify-center gap-2 shadow-sm mb-10">
        <span class="text-base">📊</span>
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-200">Real-Time</span>
    </div>

  </main>

  <!-- Bagian Bawah: Panel Aksi (Warna Putih) -->
  <footer class="bg-white text-slate-800 rounded-t-[2.5rem] w-full max-w-md mx-auto p-8 shadow-[0_-10px_40px_rgba(0,0,0,0.2)]">
      
      <!-- Tombol Menuju Login -->
      <a href="login.html" class="w-full bg-[#E65C00] hover:bg-orange-600 text-white font-black text-xs sm:text-sm py-4 rounded-2xl flex items-center justify-center gap-2 uppercase tracking-widest transition-all active:scale-95 shadow-[0_8px_20px_rgba(230,92,0,0.3)] mb-8">
        <span class="text-lg leading-none pt-0.5">👤</span> AKSES LOGIN PORTAL
      </a>
      
      <!-- Footer Info -->
      <div class="text-center flex flex-col items-center">
        <!-- Logo Kecil Abu-abu (Opsional, jika mau diklik ke index juga bisa) -->
        <a href="index.html" class="w-10 h-10 mb-3 opacity-30 grayscale hover:grayscale-0 hover:opacity-100 transition-all block">
           <img src="/images/logo.png" alt="Logo Footer" class="w-full h-full object-cover rounded-md" onerror="this.src='https://via.placeholder.com/40'">
        </a>
        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Aviando Collector System</p>
        <p class="text-[8px] font-bold text-slate-300 mt-1">Developed by PT. TPI</p>
      </div>

  </footer>

</body>
</html>
