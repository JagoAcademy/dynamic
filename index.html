<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tirta Nirwana - Terbang di Air</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Menambahkan font Montserrat untuk Headline yang elegan & dinamis -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@0,700;0,900;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-dynamic { font-family: 'Montserrat', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center">

  <div class="w-full max-w-md bg-slate-50 min-h-screen shadow-2xl relative pb-20">
    
    <!-- Hero Section (Warna Oranye) -->
    <div class="bg-gradient-to-br from-orange-600 to-orange-400 px-6 pt-16 pb-28 rounded-b-[3rem] shadow-lg text-white relative overflow-hidden">
      
      <!-- Efek Splash Halus di Background -->
      <div class="absolute top-0 right-0 w-48 h-48 bg-white opacity-10 rounded-full blur-3xl -mr-10 -mt-10"></div>
      <div class="absolute bottom-10 left-0 w-32 h-32 bg-orange-300 opacity-20 rounded-full blur-2xl -ml-10"></div>

      <div class="relative z-10">
        <!-- Headline & Sub-headline Baru -->
        <h1 class="text-[2.5rem] font-dynamic font-black tracking-tight leading-none uppercase italic mb-2 drop-shadow-md">
          Terbang<br>di Air
        </h1>
        <h2 class="text-lg font-bold mb-1 opacity-95">
          Bersama Tirta Nirwana
        </h2>
        <p class="text-sm font-medium opacity-80 mb-8 tracking-wide">
          Tirta Nirwana - Surabaya
        </p>

        <!-- Profil Coach Baru -->
        <div class="inline-flex items-center bg-white/20 backdrop-blur-md border border-white/40 rounded-full pr-6 p-1.5 shadow-sm">
          <!-- Menggunakan Aset Logo Baru sebagai Avatar -->
          <img src="68337.png" alt="Coach Avatar" class="w-11 h-11 rounded-full border-2 border-white object-cover bg-black">
          <div class="ml-3">
            <p class="text-sm font-bold leading-tight">Coach Nike</p>
            <p class="text-[10px] font-semibold tracking-wider uppercase opacity-90">Head and Founder</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Container Grid Tombol -->
    <div class="px-6 -mt-14 relative z-20">
      <div class="grid grid-cols-2 gap-4">
        
        <!-- Tombol: Login Portal -->
        <a href="#" class="bg-white py-8 px-4 rounded-3xl shadow-[0_8px_20px_rgb(0,0,0,0.06)] flex flex-col items-center justify-center gap-3 border border-transparent hover:border-orange-200 hover:shadow-orange-500/10 transition-all active:scale-95 group">
          <div class="text-4xl group-hover:scale-110 transition-transform duration-300">🔐</div>
          <span class="text-[13px] font-bold text-slate-700">Login Portal</span>
        </a>

        <!-- Tombol: Athlete Reg -->
        <a href="#" class="bg-white py-8 px-4 rounded-3xl shadow-[0_8px_20px_rgb(0,0,0,0.06)] flex flex-col items-center justify-center gap-3 border border-transparent hover:border-orange-200 hover:shadow-orange-500/10 transition-all active:scale-95 group">
          <div class="text-4xl group-hover:scale-110 transition-transform duration-300">🏊</div>
          <span class="text-[13px] font-bold text-slate-700">Athlete Reg</span>
        </a>

        <!-- Tombol: Training -->
        <a href="#" class="bg-white py-8 px-4 rounded-3xl shadow-[0_8px_20px_rgb(0,0,0,0.06)] flex flex-col items-center justify-center gap-3 border border-transparent hover:border-orange-200 hover:shadow-orange-500/10 transition-all active:scale-95 group">
          <div class="text-4xl group-hover:scale-110 transition-transform duration-300">⏱️</div>
          <span class="text-[13px] font-bold text-slate-700">Training</span>
        </a>

        <!-- Tombol: Kalender -->
        <a href="#" class="bg-white py-8 px-4 rounded-3xl shadow-[0_8px_20px_rgb(0,0,0,0.06)] flex flex-col items-center justify-center gap-3 border border-transparent hover:border-orange-200 hover:shadow-orange-500/10 transition-all active:scale-95 group">
          <div class="text-4xl group-hover:scale-110 transition-transform duration-300">📅</div>
          <span class="text-[13px] font-bold text-slate-700">Kalender</span>
        </a>

      </div>
    </div>

  </div>
</body>
</html>
