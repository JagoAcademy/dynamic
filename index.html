<body class="bg-slate-100 min-h-screen flex flex-col items-center relative">

  <!-- Container (Tetap responsif untuk Desktop & Mobile) -->

        <h2 class="text-lg lg:text-2xl font-bold mb-1 opacity-95 drop-shadow-sm">
          Bersama Tirta Nirwana
        </h2>
        <p class="text-xs lg:text-sm font-medium opacity-80 tracking-wide">
          Tirta Nirwana - Surabaya

          </svg>
          <span class="text-[13px] lg:text-[15px] font-bold text-white tracking-wide drop-shadow-md">Training</span>
        </a>

      <a href="public/daftar.html" class="flex items-center gap-2 lg:gap-3 bg-[#0B1B3D] hover:bg-blue-900 text-white px-7 py-3.5 lg:px-9 lg:py-4 rounded-full shadow-lg shadow-blue-900/30 active:scale-95 transition-all">
        <span class="text-[13px] lg:text-[15px] font-black uppercase tracking-wide text-orange-400">Join Club</span>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 lg:w-5 lg:h-5 text-orange-400">
