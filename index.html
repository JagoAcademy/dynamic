<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AVIANDO COLLECTOR SYSTEM</title>
  
  <!-- Meta Tags & OG untuk Preview Link -->
  <meta name="title" content="AVIANDO COLLECTOR SYSTEM" />
  <meta name="description" content="Sistem penagihan terpadu (Debt Collection System) profesional. Pantau aktivitas lapangan dan tingkatkan recovery rate secara real-time." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://aviando.vercel.app/" />
  <meta property="og:title" content="AVIANDO COLLECTOR SYSTEM" />
  <meta property="og:description" content="Sistem penagihan terpadu (Debt Collection System) profesional. Pantau aktivitas lapangan dan tingkatkan recovery rate secara real-time." />
  <meta property="og:image" content="https://aviando.vercel.app/images/meta.jpg" />
  <meta property="og:site_name" content="Aviando Collector System" />
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://aviando.vercel.app/" />
  <meta property="twitter:title" content="AVIANDO COLLECTOR SYSTEM" />
  <meta property="twitter:description" content="Sistem penagihan terpadu profesional." />
  <meta property="twitter:image" content="https://aviando.vercel.app/images/meta.jpg" />
  
  <meta name="theme-color" content="#0f2b5c">

  <!-- Manifest Link untuk Fitur Install PWA -->
  <link rel="manifest" href="/manifest.json">

  <!-- FULL STYLING (Desktop Full Screen & Mobile Responsive) -->
  <style>
    /* Reset & Global */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      /* Menghilangkan scrollbar pada body */
      overflow: hidden !important; 
      width: 100vw;
      height: 100vh;
    }

    /* Container Utama */
    .app-container {
      display: flex;
      width: 100%;
      height: 100vh;
      -ms-overflow-style: none;  /* Internet Explorer dan Edge */
      scrollbar-width: none;  /* Mozilla Firefox */
    }
    
    .app-container::-webkit-scrollbar {
      display: none !important; /* Chrome, Safari, Opera */
    }

    /* --- LAYOUT DESKTOP (FULL SCREEN SPLIT) --- */
    @media (min-width: 768px) {
      .app-container {
        flex-direction: row;
      }
      
      .top-section {
        flex: 1.2;
        background: linear-gradient(135deg, #0f2b5c, #1a4a9c);
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 10%;
      }

      .bottom-section {
        flex: 1;
        background: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 5%;
        box-shadow: -10px 0 30px rgba(0,0,0,0.05);
      }

      .features-grid {
        flex-direction: row;
        flex-wrap: wrap;
      }
    }

    /* --- LAYOUT MOBILE (STACKED) --- */
    @media (max-width: 767px) {
      body {
        overflow-y: auto !important; /* Izinkan scroll di mobile jika konten panjang */
      }
      
      .app-container {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        background: #0f2b5c; /* Warna background atas */
      }

      .top-section {
        background: linear-gradient(135deg, #0f2b5c, #1a4a9c);
        color: white;
        padding: 40px 20px 60px 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .bottom-section {
        background: white;
        flex: 1;
        border-radius: 30px 30px 0 0;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: -30px; /* Efek numpuk ke atas */
        box-shadow: 0 -10px 20px rgba(0,0,0,0.1);
      }

      .features-grid {
        justify-content: center;
      }
      
      .description {
        text-align: center;
      }
    }

    /* --- ELEMEN DESAIN SPESIFIK --- */
    .logo-wrapper {
      margin-bottom: 20px;
    }
    
    .logo-img {
      width: 80px;
      height: auto;
      border-radius: 12px;
      background: rgba(255, 255, 255, 1); /* Beri background putih jika logo gelap, sesuaikan jika perlu */
      padding: 5px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .title-main {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .title-sub {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      opacity: 0.9;
      margin-bottom: 25px;
      font-weight: 500;
    }

    .description {
      font-size: 1rem;
      line-height: 1.6;
      opacity: 0.85;
      margin-bottom: 35px;
      max-width: 450px;
    }

    .highlight {
      font-weight: bold;
      color: #ffc107;
    }

    .features-grid {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .feature-item {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 16px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .feature-icon {
      font-size: 1.2rem;
    }

    .feature-text {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Tombol Login */
    .btn-login {
      background: #0f2b5c;
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 1.1rem;
      border-radius: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      max-width: 350px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(15, 43, 92, 0.25);
      margin-bottom: 40px;
    }

    .btn-login:hover {
      background: #1a4a9c;
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(15, 43, 92, 0.35);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    /* Footer */
    .footer {
      text-align: center;
      color: #888;
      font-size: 0.85rem;
      margin-top: auto;
      width: 100%;
    }

    .footer-logo {
      width: 40px;
      opacity: 0.4;
      margin-bottom: 10px;
      filter: grayscale(100%);
    }

    .footer-title {
      font-weight: 800;
      margin-bottom: 5px;
      color: #444;
      letter-spacing: 0.5px;
    }

    .developer-text span {
      font-weight: bold;
      color: #0f2b5c;
    }
  </style>
</head>
<body>

  <!-- Kontainer Utama -->
  <div class="app-container">
    
    <!-- BAGIAN ATAS (Kiri di Desktop, Atas di Mobile) -->
    <div class="top-section">
      <div class="logo-wrapper">
        <img src="/images/logo.png" alt="Logo ACS" class="logo-img" onerror="this.src='https://via.placeholder.com/80?text=ACS'">
      </div>
      
      <h1 class="title-main">Aviando<br>Collector System</h1>
      <p class="title-sub">Sistem Penagihan Terpadu</p>
      
      <p class="description">
        Platform manajemen tugas penagihan. Pantau aktivitas lapangan dan tingkatkan <span class="highlight">recovery rate</span> secara real-time.
      </p>
      
      <div class="features-grid">
        <div class="feature-item">
          <div class="feature-icon">⚖️</div>
          <span class="feature-text">TASK ASSIGN</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon">⚡</div>
          <span class="feature-text">FAST UPDATE</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon">📊</div>
          <span class="feature-text">REAL-TIME</span>
        </div>
      </div>
    </div>

    <!-- BAGIAN BAWAH (Kanan di Desktop, Bawah di Mobile) -->
    <div class="bottom-section">
      <button class="btn-login" onclick="location.href='/login.html'">
        <span>👤</span>
        <span>AKSES LOGIN PORTAL</span>
      </button>
      
      <div class="footer">
        <img src="/images/logo.png" alt="Logo Footer" class="footer-logo" onerror="this.style.display='none'">
        <p class="footer-title">AVIANDO COLLECTOR SYSTEM</p>
        <p class="developer-text">Developed by <span>PT. TPI</span></p>
        <p>&copy; 2026 All Rights Reserved.</p>
      </div>
    </div>

  </div>

  <!-- Script Otomatis Registrasi Service Worker (PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('✅ PWA: Service Worker terdaftar beres!', reg))
          .catch(err => console.error('❌ PWA: Gagal daftar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
