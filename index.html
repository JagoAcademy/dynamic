<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tirta Nirwana - Terbang di Air</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Setup -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@0,700;0,900;1,800;1,900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-dynamic { font-family: 'Montserrat', sans-serif; }
    /* Sembunyikan scrollbar agar bersih */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center relative">

  <!-- Mobile Container -->
  <div class="w-full max-w-md bg-slate-50 min-h-screen shadow-2xl relative pb-32 overflow-x-hidden">
    
    <!-- Hero Section -->
    <div class="bg-gradient-to-br from-[#E65C00] to-[#F9D423] px-6 pt-14 pb-28 rounded-b-[3rem] shadow-lg text-white relative overflow-hidden">
      
      <!-- Efek Splash Background -->
      <div class="absolute top-0 right-0 w-48 h-48 bg-white opacity-10 rounded-full blur-3xl -mr-10 -mt-10"></div>
      <div class="absolute bottom-10 left-0 w-32 h-32 bg-orange-200 opacity-20 rounded-full blur-2xl -ml-10"></div>

      <!-- LOGO WATERMARK BESAR (Transparan 40% di Kanan Atas) -->
      <img src="public/images/logo.png" alt="Logo Watermark" class="absolute -top-4 -right-12 w-72 h-72 object-contain opacity-40 z-0 pointer-events-none drop-shadow-2xl">

      <!-- Konten Teks Header -->
      <div class="relative z-10 mb-2">
        <h1 class="text-[2.5rem] font-dynamic font-black tracking-tight leading-none uppercase italic mb-2 drop-shadow-md">
          Terbang<br>di Air
        </h1>
        <h2 class="text-lg font-bold mb-1 opacity-95">
          Bersama Tirta Nirwana
        </h2>
        <p class="text-xs font-medium opacity-80 tracking-wide">
          Tirta Nirwana - Surabaya
        </p>
      </div>

      <!-- Profil Coach -->
      <div class="relative z-10 inline-flex items-center bg-black/20 backdrop-blur-sm border border-white/30 rounded-full pr-6 p-1.5 shadow-sm mt-4">
        <img src="public/images/logo.png" alt="Logo Coach" class="w-11 h-11 rounded-full border-2 border-white object-cover bg-[#0B1B3D]">
        <div class="ml-3">
          <p class="text-sm font-bold leading-tight">Coach Nike</p>
          <p class="text-[10px] font-semibold tracking-wider uppercase text-orange-100">Head and Founder</p>
        </div>
      </div>

    </div>

    <!-- Container Grid Tombol Utama -->
    <div class="px-6 -mt-14 relative z-20">
      <div class="grid grid-cols-2 gap-4">
        
        <!-- Login Portal -->
        <a href="login.html" class="bg-white py-8 px-4 rounded-3xl shadow-[0_8px_20px_rgb(0,0,0,0.06)] flex flex-col items-center justify-center gap-3 border border-transparent hover:border-orange-200 hover:shadow-orange-500/10 transition-all active:scale-95 group">
          <div class="text-4xl group-hover:scale-110 transition-transform duration-300">🔐</div>
          <span class="text-[13px] font-bold text-slate-700">Login Portal</span>
        </a>

        <!-- Athlete Reg (Sudah diarahin ke siswa.html) -->
        <a href="siswa.html" class="bg-white py-8 px-4 rounded-3xl shadow-[0_8px_20px_rgb(0,0,0,0.06)] flex flex-col items-center justify-center gap-3 border border-transparent hover:border-orange-200 hover:shadow-orange-500/10 transition-all active:scale-95 group">
          <div class="text-4xl group-hover:scale-110 transition-transform duration-300">🏊</div>
          <span class="text-[13px] font-bold text-slate-700">Athlete Reg</span>
        </a>

        <!-- Training (Sudah direset) -->
        <a href="#" class="bg-white py-8 px-4 rounded-3xl shadow-[0_8px_20px_rgb(0,0,0,0.06)] flex flex-col items-center justify-center gap-3 border border-transparent hover:border-orange-200 hover:shadow-orange-500/10 transition-all active:scale-95 group">
          <div class="text-4xl group-hover:scale-110 transition-transform duration-300">⏱️</div>
          <span class="text-[13px] font-bold text-slate-700">Training</span>
        </a>

        <!-- Kalender -->
        <a href="#" class="bg-white py-8 px-4 rounded-3xl shadow-[0_8px_20px_rgb(0,0,0,0.06)] flex flex-col items-center justify-center gap-3 border border-transparent hover:border-orange-200 hover:shadow-orange-500/10 transition-all active:scale-95 group">
          <div class="text-4xl group-hover:scale-110 transition-transform duration-300">📅</div>
          <span class="text-[13px] font-bold text-slate-700">Kalender</span>
        </a>

      </div>
    </div>

    <!-- BOTTOM FLOATING NAVIGATION MENU (Biar ngga kaku) -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[85%] max-w-[360px] bg-white/90 backdrop-blur-md border border-white/50 flex justify-between items-center py-3 px-8 z-50 rounded-full shadow-[0_15px_35px_rgba(0,0,0,0.1)]">
      
      <!-- Kiri: WhatsApp -->
      <a href="https://wa.me/6285852532681" target="_blank" class="flex items-center gap-2 text-green-600 hover:text-green-500 active:scale-95 transition-all">
        <span class="text-2xl drop-shadow-sm">💬</span>
        <span class="text-[13px] font-black uppercase tracking-wide">Hubungi WA</span>
      </a>
      
      <!-- Garis Pemisah (Divider) -->
      <div class="w-[2px] h-8 bg-slate-200 rounded-full"></div>

      <!-- Kanan: Daftar / Join Club -->
      <a href="public/daftar.html" class="flex items-center gap-2 text-blue-600 hover:text-blue-500 active:scale-95 transition-all">
        <span class="text-[13px] font-black uppercase tracking-wide">Join Club</span>
        <span class="text-2xl drop-shadow-sm">🚀</span>
      </a>
      
    </div>

  </div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
