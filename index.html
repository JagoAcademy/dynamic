<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Dynamic Club LongStorage</title>
  
  <!-- CDN Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .shadow-soft { box-shadow: 0 8px 30px rgba(0,0,0,0.06); }
  </style>
</head>

<body class="bg-slate-100 min-h-screen flex flex-col items-center antialiased">

  <div class="w-full max-w-md bg-slate-50 min-h-screen shadow-2xl relative pb-12 overflow-hidden">

    <!-- 1. Hero Section (Bagian Atas) -->
    <div class="relative bg-gradient-to-br from-blue-800 to-blue-600 text-white pt-16 pb-28 px-6 rounded-b-[2.5rem] shadow-xl overflow-hidden">
      
      <!-- Watermark Logo DAC (Putih, Opacity 8%, Posisi Kanan Atas) -->
      <!-- Efek putih didapat dari: brightness-0 invert -->
      <div class="absolute top-[-10px] right-[-40px] w-80 h-80 transform rotate-12 pointer-events-none select-none">
        <img src="/images/logo.png" alt="DAC Watermark" class="w-full h-full object-contain brightness-0 invert opacity-[0.08]">
      </div>
      
      <!-- Headline (Focal Point Utama) -->
      <div class="relative z-10">
        <h1 class="text-[3.2rem] font-black tracking-tighter mb-1 leading-[1.05]">
          CONQUER<br/>
          <span class="text-blue-200">THE WATER</span>
        </h1>
        <p class="text-white text-sm font-semibold tracking-wide mb-8 opacity-90">
          Dynamic Aquatic Club • Long Storage
        </p>
        
        <!-- Coach Profile Pill (Trust Badge) -->
        <div class="inline-flex items-center bg-white/10 backdrop-blur-md px-1.5 py-1.5 pr-5 rounded-full border border-white/20 shadow-lg">
          <!-- Logo DAC Kecil di dalam badge -->
          <div class="w-10 h-10 rounded-full bg-white mr-3 flex items-center justify-center overflow-hidden shrink-0">
            <img src="/images/logo.png" class="w-full h-full object-contain p-1" alt="DAC Badge">
          </div>
          <div class="text-left">
            <span class="font-bold block leading-none text-sm text-white mb-0.5">Coach Bryan Adam</span>
            <span class="text-[10px] text-blue-200 font-semibold uppercase tracking-wider">Head Coach & Founder</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. Menu Grid -->
    <div class="px-6 -mt-12 relative z-10 grid grid-cols-2 gap-4">
      
      <button onclick="window.location.href='login.html'" class="bg-white py-6 px-4 rounded-3xl shadow-soft hover:shadow-xl hover:-translate-y-1.5 transition-all duration-300 flex flex-col items-center text-center group">
        <div class="w-14 h-14 bg-slate-50 rounded-full flex items-center justify-center text-3xl mb-3 group-hover:scale-110 transition-transform">
          📋
        </div>
        <span class="font-bold text-slate-800 text-[13px]">Coach Menu</span>
      </button>

      <button onclick="window.location.href='siswa.html'" class="bg-white py-6 px-4 rounded-3xl shadow-soft hover:shadow-xl hover:-translate-y-1.5 transition-all duration-300 flex flex-col items-center text-center group">
        <div class="w-14 h-14 bg-slate-50 rounded-full flex items-center justify-center text-3xl mb-3 group-hover:scale-110 transition-transform">
          🏊‍♂️
        </div>
        <span class="font-bold text-slate-800 text-[13px]">Athlete Reg</span>
      </button>

      <button onclick="window.location.href='training.html'" class="bg-white py-6 px-4 rounded-3xl shadow-soft hover:shadow-xl hover:-translate-y-1.5 transition-all duration-300 flex flex-col items-center text-center group">
        <div class="w-14 h-14 bg-slate-50 rounded-full flex items-center justify-center text-3xl mb-3 group-hover:scale-110 transition-transform">
          ⏱️
        </div>
        <span class="font-bold text-slate-800 text-[13px]">Training</span>
      </button>

      <button onclick="window.location.href='event.html'" class="bg-white py-6 px-4 rounded-3xl shadow-soft hover:shadow-xl hover:-translate-y-1.5 transition-all duration-300 flex flex-col items-center text-center group">
        <div class="w-14 h-14 bg-slate-50 rounded-full flex items-center justify-center text-3xl mb-3 group-hover:scale-110 transition-transform">
          📅
        </div>
        <span class="font-bold text-slate-800 text-[13px]">Kalender</span>
      </button>

    </div>

    <!-- 3. Call to Action -->
    <div class="px-6 mt-10 space-y-3">
      
      <button onclick="window.location.href='daftar.html'" class="w-full bg-blue-600 text-white font-black text-sm uppercase tracking-widest py-4 rounded-2xl shadow-lg shadow-blue-500/30 active:scale-95 transition-all flex justify-center items-center gap-2">
        DAFTAR SEKARANG 🚀
      </button>
      
      <button onclick="window.open('https://wa.me/1234567890', '_blank')" class="w-full bg-transparent text-slate-600 font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 hover:bg-slate-100 active:scale-95 transition-colors">
        Hubungi via WhatsApp
      </button>
      
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
