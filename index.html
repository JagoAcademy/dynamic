<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AVIANDO COLLECTOR SYSTEM</title>
  
  <meta name="theme-color" content="#0B1B3D">
  <link rel="manifest" href="/manifest.json">
  
  <!-- MEMANGGIL CSS YANG BARU -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- KIRI (PC) / ATAS (HP) -->
    <div class="top-section">
      <div class="logo-wrapper">
        <img src="/images/logo.png" alt="Logo ACS" class="logo-img" onerror="this.src='https://via.placeholder.com/90?text=ACS'">
      </div>
      
      <h1 class="title-main">Aviando<br>Collector System</h1>
      <p class="title-sub">Sistem Penagihan Terpadu</p>
      
      <p class="description">
        Platform manajemen tugas penagihan. Pantau aktivitas lapangan dan tingkatkan <span class="highlight">recovery rate</span> secara real-time.
      </p>
      
      <div class="features-grid">
        <div class="feature-item">
          <span class="feature-icon">⚖️</span>
          <span class="feature-text">TASK ASSIGN</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">⚡</span>
          <span class="feature-text">FAST UPDATE</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">📊</span>
          <span class="feature-text">REAL-TIME</span>
        </div>
      </div>
    </div>

    <!-- KANAN (PC) / BAWAH (HP) -->
    <div class="bottom-section">
      <button class="btn-login" onclick="location.href='/login.html'">
        <span>👤</span>
        <span>AKSES LOGIN PORTAL</span>
      </button>
      
      <div class="footer">
        <img src="/images/logo.png" alt="Logo Footer" class="footer-logo" onerror="this.style.display='none'">
        <p class="footer-title">AVIANDO COLLECTOR SYSTEM</p>
        <p class="developer-text">Developed by PT. TPI</p>
      </div>
    </div>

  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
