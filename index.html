<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aviando Collector System</title>
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://tailwindcss.com"></script>
  
  <!-- Manifest Link untuk Fitur Install PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f2b5c">
</head>
<!-- Mengunci tinggi body pas 100dvh agar tidak ada scrollbar bawaan browser -->
<body class="bg-[#0f2b5c] h-[100dvh] w-full overflow-hidden flex items-center justify-center font-sans">

  <!-- KONTAINER UTAMA: Membatasi lebar di desktop (max-w-md), pas layar penuh di mobile -->
  <div class="w-full max-w-md h-full mx-auto flex flex-col justify-between p-6 bg-gradient-to-b from-[#0f2b5c] via-[#133773] to-white shadow-2xl">
    
    <!-- BAGIAN ATAS: Logo, Judul & Grid Fitur (Menggunakan flex-1 agar fleksibel mengisi sisa ruang) -->
    <div class="flex flex-col items-center text-center justify-center flex-1 space-y-4 md:space-y-6">
      
      <!-- Lingkaran Logo ACS -->
      <div class="w-28 h-28 bg-white rounded-full flex items-center justify-center p-2 shadow-xl">
        <!-- Gantilah src="logo.png" dengan path gambar logo kamu -->
        <img src="logo.png" alt="Logo ACS" class="w-full h-full object-contain rounded-full">
      </div>
      
      <!-- Judul & Deskripsi Aplikasi -->
      <div class="space-y-1">
        <h1 class="text-white font-extrabold text-2xl md:text-3xl tracking-wide uppercase leading-tight">
          Aviando<br>Collector System
        </h1>
        <p class="text-orange-500 font-semibold text-sm tracking-wider uppercase">Sistem Penagihan Terpadu</p>
      </div>
      
      <p class="text-gray-200 text-xs md:text-sm px-4 leading-relaxed opacity-90 max-w-xs">
        Platform manajemen tugas penagihan. Pantau aktivitas lapangan dan tingkatkan <span class="font-bold text-orange-400">recovery rate</span> secara real-time.
      </p>
      
      <!-- Grid 3 Fitur -->
      <div class="grid grid-cols-3 gap-2 bg-white/95 backdrop-blur-sm rounded-2xl p-4 shadow-lg w-full mt-2">
        <div class="flex flex-col items-center text-center p-1">
          <div class="text-blue-900 text-xl mb-1">⚖</div>
          <span class="font-black text-[10px] text-blue-950 tracking-wider">TASK ASSIGN</span>
        </div>
        <div class="flex flex-col items-center text-center p-1 border-x border-gray-100">
          <div class="text-orange-500 text-xl mb-1">⚡</div>
          <span class="font-black text-[10px] text-blue-950 tracking-wider">FAST UPDATE</span>
        </div>
        <div class="flex flex-col items-center text-center p-1">
          <div class="text-green-600 text-xl mb-1">📊</div>
          <span class="font-black text-[10px] text-blue-950 tracking-wider">REAL-TIME</span>
        </div>
      </div>
      
    </div>

    <!-- BAGIAN BAWAH: Tombol Akses Portal & Footer (Otomatis menempel di paling bawah layar) -->
    <div class="w-full space-y-5 pt-2 pb-1">
      
      <!-- Tombol Akses Login Portal -->
      <button class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-md flex items-center justify-center space-x-2 active:scale-[0.98] transition-all duration-150 tracking-wide text-sm">
        <span class="text-base">👤</span>
        <span>AKSES LOGIN PORTAL</span>
      </button>
      
      <!-- Footer Copyright -->
      <div class="text-center text-[10px] text-gray-500 flex flex-col items-center space-y-1">
        <!-- Mini Logo Footer -->
        <img src="logo.png" alt="Logo Footer" class="w-7 h-7 object-contain opacity-60 mb-0.5">
        <p class="font-bold text-blue-950 tracking-wider text-[11px]">AVIANDO COLLECTOR SYSTEM</p>
        <p class="text-gray-400">Developed by <span class="text-orange-500 font-semibold">ADITYA WEB-DEV</span></p>
        <p class="text-gray-400/80">© 2026 All Rights Reserved.</p>
      </div>
      
    </div>

  </div>

  <!-- Script Otomatis Daftar Service Worker (PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('✅ PWA: Service Worker terdaftar beres!', reg))
          .catch(err => console.error('❌ PWA: Gagal daftar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
