<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - AVIANDO COLLECTOR SYSTEM</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body, html {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #E2E8F0; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      /* overflow hidden gue cabut biar kalau layar HP lu kecil banget, dia masih bisa di-scroll dikit dengan natural */
    }

    .app-container {
      width: 100%;
      max-width: 480px; 
      
      /* JURUS SAKTI: dvh (Dynamic Viewport Height) 
         Otomatis ngikutin ukuran asli layar HP lu walau ada URL Bar Chrome */
      min-height: 100dvh; 
      
      background: linear-gradient(180deg, #0B1B3D 0%, #1E40AF 40%, #F1F5F9 100%);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Bikin wujud HP-nya nyata kalau dibuka di PC/Laptop */
    @media (min-width: 481px) {
      .app-container {
        min-height: unset;
        height: 90vh;
        max-height: 850px;
        border-radius: 40px;
        border: 14px solid #0F172A; 
        box-shadow: 0 25px 50px -12px rgba(11, 27, 61, 0.4);
        
        /* Aktifin scroll internal cuma buat di layar PC */
        overflow-y: auto; 
        -ms-overflow-style: none !important;
        scrollbar-width: none !important; 
      }
      
      /* Hilangkan scrollbar bawaan PC/Chrome */
      .app-container::-webkit-scrollbar {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- BINGKAI LAYAR HP -->
  <div class="app-container">
    
    <!-- BAGIAN ATAS: Logo & Judul -->
    <div class="flex flex-col items-center justify-center pt-12 pb-6 px-6 text-center">
      <div class="bg-white p-3 rounded-full shadow-[0_0_20px_rgba(255,255,255,0.15)] mb-4">
        <img src="/images/logo.png" alt="Logo ACS" class="w-16 h-16 object-contain">
      </div>
      <h1 class="text-2xl font-black text-white uppercase tracking-widest mb-1.5">Login Portal</h1>
      <p class="text-[10px] font-bold text-blue-200 uppercase tracking-widest px-4 leading-relaxed">
        Collector, Admin, & Owner
      </p>
    </div>

    <!-- BAGIAN TENGAH: Form Login -->
    <div class="px-6 flex-1 w-full flex flex-col justify-center relative z-10">
      <div class="bg-white rounded-[24px] p-7 shadow-[0_20px_40px_-15px_rgba(11,27,61,0.15)] border border-slate-100">
        
        <!-- ELEMENT PESAN ERROR -->
        <div id="errorMsg" class="hidden mb-4 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-[11px] font-bold text-center"></div>

        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Username</label>
            <input type="text" id="username" required placeholder="Masukkan username" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none transition-all placeholder:text-slate-300 font-semibold">
          </div>
          
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Password</label>
            <input type="password" id="password" required placeholder="Masukkan password" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none transition-all placeholder:text-slate-300 font-semibold">
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-[#E65C00] hover:bg-orange-600 text-white font-bold text-sm py-4 rounded-xl mt-4 active:scale-95 transition-all shadow-[0_8px_20px_rgba(230,92,0,0.25)]">
            Login Sekarang
          </button>
        </form>

        <div class="mt-6 text-center">
          <a href="/index.html" class="text-[11px] font-bold text-slate-400 hover:text-orange-500 transition-colors tracking-wide">
            &larr; Kembali ke Beranda
          </a>
        </div>
        
      </div>
    </div>

    <!-- BAGIAN BAWAH: Footer -->
    <div class="pb-8 pt-6 flex flex-col items-center justify-center mt-auto relative z-0">
      <img src="/images/logo.png" alt="Footer Logo" class="w-6 h-6 grayscale mb-2 opacity-30 mix-blend-multiply">
      <p class="text-[9px] font-black text-slate-500 uppercase tracking-[0.2em] mb-1">Aviando Collector System</p>
      <p class="text-[8px] font-bold text-slate-400 tracking-wider">Developed by ADITYA WEB-DEV</p>
    </div>

  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
