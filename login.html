<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Portal - AVIANDO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen flex justify-center items-center p-4">
  <div class="w-full max-w-sm md:max-w-md lg:max-w-lg bg-white rounded-[2rem] shadow-2xl overflow-hidden transition-all duration-300">
    
    <div class="bg-gradient-to-br from-[#0B1B3D] to-[#163063] p-8 text-center relative overflow-hidden">
      <!-- FRAME LOGO -->
      <div class="relative z-10 flex justify-center mb-5">
        <div class="w-24 h-24 bg-white rounded-full p-2 shadow-xl border-4 border-white/20 flex items-center justify-center overflow-hidden">
          <img src="/images/logo.png" alt="Logo AVIANDO" class="w-full h-full object-contain">
        </div>
      </div>
      
      <h2 class="text-2xl font-black text-white tracking-tight mt-2">LOGIN PORTAL</h2>
      <p class="text-slate-300 text-sm font-medium mt-1">Portal Log In: Collector, Admin, & Owner AVIANDO</p>
    </div>

    <div class="p-8 pt-6">
      <div id="errorMsg" class="hidden bg-red-50 text-red-600 text-sm font-semibold p-3 rounded-xl mb-4 border border-red-100 text-center">
        Akun tidak ditemukan!
      </div>
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-slate-700 text-xs font-bold mb-2 uppercase tracking-wide">Username / Email</label>
          <input type="text" id="username" required placeholder="Masukkan username" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-800 focus:bg-white transition-all">
        </div>
        <div>
          <label class="block text-slate-700 text-xs font-bold mb-2 uppercase tracking-wide">Password</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-800 focus:bg-white transition-all">
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-[#E65C00] text-white font-bold text-sm uppercase tracking-wider py-4 rounded-xl shadow-lg hover:bg-orange-600 active:scale-95 transition-all mt-4">
          Login Sekarang
        </button>
      </form>
      <div class="mt-6 text-center">
        <a href="index.html" class="text-slate-400 hover:text-orange-500 text-sm font-medium transition-colors">&larr; Kembali ke Beranda</a>
      </div>
    </div>
  </div>
  <script type="module" src="/src/login.js"></script>
</body>
</html>
