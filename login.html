<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Login - AVIANDO COLLECTOR SYSTEM</title>
  
  <meta name="theme-color" content="#0B1B3D">
  <link rel="manifest" href="/manifest.json">

  <!-- MEMANGGIL CSS YANG BARU -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- KIRI (PC) / ATAS (HP) -->
    <div class="top-section">
      <div class="logo-wrapper">
        <img src="/images/logo.png" alt="Logo ACS" class="logo-img" onerror="this.src='https://via.placeholder.com/90?text=ACS'">
      </div>
      <h1 class="title-main" style="font-size: clamp(1.8rem, 4vw, 2.5rem);">Portal Login</h1>
      <p class="title-sub" style="margin-bottom: 0;">Collector, Admin, & Owner</p>
    </div>

    <!-- KANAN (PC) / BAWAH (HP) -->
    <div class="bottom-section">
      
      <!-- FORM BUNGKUS -->
      <div class="form-box">
        <!-- Notifikasi Error -->
        <div id="errorMsg" class="alert-error hidden"></div>

        <form id="loginForm">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" required placeholder="Masukkan username" class="form-input">
          </div>
          
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required placeholder="Masukkan password" class="form-input">
          </div>

          <button type="submit" id="submitBtn" class="submit-btn">
            Login Sekarang
          </button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
          <a href="/index.html" style="color: #64748b; font-size: 12px; font-weight: 700; text-decoration: none;">
            &larr; Kembali ke Beranda
          </a>
        </div>
      </div>
      
      <!-- FOOTER -->
      <div class="footer">
        <img src="/images/logo.png" alt="Footer Logo" class="footer-logo" onerror="this.style.display='none'">
        <p class="footer-title">AVIANDO COLLECTOR SYSTEM</p>
        <p class="developer-text">Developed by PT. TPI</p>
      </div>

    </div>

  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
