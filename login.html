<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Login - AVIANDO COLLECTOR SYSTEM</title>
  
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>

  <div class="app-container">
    
    <div class="top-section" style="flex: 0.8; justify-content: flex-end;">
      <div class="logo-wrapper" style="width: 80px; height: 80px; margin-bottom: 10px;">
        <img src="/images/logo.png" alt="Logo ACS" class="logo-img">
      </div>
      <h1 class="title-main" style="font-size: 20px;">Portal Login</h1>
      <p class="title-sub" style="font-size: 11px;">Collector, Admin, & Owner</p>
    </div>

    <div class="bottom-section" style="flex: 1.2;">
      <div class="form-box">
        <div id="errorMsg" class="alert-error hidden"></div>

        <form id="loginForm">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" required placeholder="Masukkan username" class="form-input">
          </div>
          
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required placeholder="Masukkan password" class="form-input">
          </div>

          <button type="submit" id="submitBtn" class="btn-login" style="margin-top: 16px; margin-bottom: 8px;">
            Login Sekarang
          </button>
        </form>

        <div style="text-align: center;">
          <a href="/index.html" class="btn-back">&larr; Kembali ke Beranda</a>
        </div>
      </div>
    </div>

    <div class="footer" style="margin-top: auto; padding-bottom: 20px;">
      <img src="/images/logo.png" alt="Footer Logo" class="footer-logo">
      <p class="footer-title">AVIANDO COLLECTOR SYSTEM</p>
      <p class="developer-text">Developed by <span>PT. TPI</span></p>
    </div>

  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
