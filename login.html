<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Login | Aviando Collector System</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
    /* Animasi Buka Tutup Modal */
    .modal-enter { animation: slideUp 0.3s ease-out forwards; }
    @keyframes slideUp { 
        from { transform: translateY(15px); opacity: 0; } 
        to { transform: translateY(0); opacity: 1; } 
    }
  </style>
</head>
<body class="flex min-h-screen items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-3xl shadow-xl border border-slate-200 overflow-hidden relative">
      <!-- Header Logo & Branding -->
      <div class="bg-[#0B1B3D] p-8 text-center relative overflow-hidden">
          <!-- Dekorasi Background -->
          <div class="absolute -top-10 -right-10 w-32 h-32 bg-white/5 rounded-full blur-2xl"></div>
          <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-[#E65C00]/20 rounded-full blur-2xl"></div>
          
          <img src="/images/logo.png" class="w-16 h-16 mx-auto bg-white p-2 rounded-2xl shadow-lg relative z-10 mb-4 object-contain" onerror="this.src='https://via.placeholder.com/64?text=ACS'">
          <h1 class="text-xl font-black text-white uppercase tracking-widest relative z-10">Aviando Collector</h1>
          <p class="text-[10px] text-orange-400 font-bold uppercase tracking-widest relative z-10 mt-1">Management System</p>
      </div>

      <!-- Form Login -->
      <div class="p-8">
          <form id="loginForm" class="space-y-5">
              
              <!-- Kolom Username -->
              <div>
                  <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Username</label>
                  <input type="text" id="username" required placeholder="Masukkan username" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm font-bold text-slate-800 focus:ring-2 focus:ring-[#E65C00] outline-none transition-all shadow-inner">
              </div>
              
              <!-- Kolom Password (Dengan Unhide & Lupa Password) -->
              <div>
                  <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Password</label>
                  <div class="relative">
                      <!-- pr-12 digunakan agar teks tidak menabrak icon mata di kanan -->
                      <input type="password" id="password" required placeholder="Masukkan password" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-4 pr-12 py-3.5 text-sm font-bold text-slate-800 focus:ring-2 focus:ring-[#E65C00] outline-none transition-all shadow-inner">
                      
                      <!-- Tombol Toggle Show/Hide -->
                      <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-[#E65C00] transition-colors focus:outline-none">
                          <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                              <!-- Icon Mata Buka (Default) -->
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                          </svg>
                      </button>
                  </div>
                  
                  <!-- Teks Lupa Password -->
                  <div class="flex justify-end mt-2">
                      <button type="button" onclick="openForgotModal()" class="text-[11px] font-bold text-slate-500 hover:text-[#E65C00] transition-colors">Lupa Password?</button>
                  </div>
              </div>
              
              <!-- Tombol Login -->
              <button type="submit" id="btnLogin" class="w-full bg-[#E65C00] hover:bg-orange-600 text-white font-black tracking-widest uppercase text-sm py-4 rounded-xl shadow-[0_8px_20px_rgba(230,92,0,0.25)] transition-all active:scale-95 flex items-center justify-center gap-2 mt-4">
                  <span>MASUK SISTEM</span>
              </button>
          </form>
      </div>
  </div>

  <!-- ============================================== -->
  <!-- MODAL POP UP LUPA PASSWORD -->
  <!-- ============================================== -->
  <div id="modalForgot" class="fixed inset-0 bg-slate-900/70 z-50 hidden flex items-center justify-center backdrop-blur-sm px-4">
      <div class="bg-white w-full max-w-sm p-6 rounded-3xl shadow-2xl relative border border-slate-200 text-center modal-enter">
          <span class="text-5xl block mb-4 drop-shadow-sm">🔒</span>
          <h3 class="text-base font-black text-[#0B1B3D] uppercase tracking-wide mb-2">Lupa Password?</h3>
          
          <p class="text-[13px] text-slate-500 mb-6 font-medium leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-100">
              Demi keamanan data, reset password tidak dapat dilakukan secara mandiri. <br><br>
              Silakan hubungi <br><b class="text-slate-700">Admin Aviando Sautma Supports</b><br> untuk meminta password baru.
          </p>
          
          <button onclick="closeForgotModal()" class="w-full bg-slate-100 text-slate-600 font-black tracking-widest uppercase text-xs py-4 rounded-xl hover:bg-slate-200 border border-slate-200 transition-all shadow-sm active:scale-95">
              KEMBALI KE LOGIN
          </button>
      </div>
  </div>

  <!-- SCRIPT LOGIKA UI LOGIN -->
  <script>
      // 1. Logika Mata (Show/Hide Password)
      function togglePassword() {
          const passInput = document.getElementById('password');
          const eyeIcon = document.getElementById('eyeIcon');
          
          // Jika sedang password (tertutup), ubah ke text (terlihat)
          if (passInput.type === 'password') {
              passInput.type = 'text';
              // Ganti ke Icon Mata Coret
              eyeIcon.innerHTML = `
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
              `;
          } else {
              // Kembalikan ke password (tertutup)
              passInput.type = 'password';
              // Ganti ke Icon Mata Terbuka
              eyeIcon.innerHTML = `
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              `;
          }
      }

      // 2. Logika Modal Lupa Password
      function openForgotModal() {
          document.getElementById('modalForgot').classList.remove('hidden');
          document.getElementById('modalForgot').classList.add('flex');
      }
      function closeForgotModal() {
          document.getElementById('modalForgot').classList.add('hidden');
          document.getElementById('modalForgot').classList.remove('flex');
      }
  </script>

  <!-- Koneksi ke Backend Supabase -->
  <script type="module" src="/src/login.js"></script>
</body>
</html>
