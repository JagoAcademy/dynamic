<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Portal - Dynamic Club</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>

<body class="bg-slate-100 min-h-screen flex justify-center items-center p-4">

  <div class="w-full max-w-sm bg-white rounded-[2rem] shadow-2xl overflow-hidden">
    
    <!-- Header Login -->
    <div class="bg-gradient-to-br from-blue-800 to-blue-600 p-8 text-center relative overflow-hidden">
      <div class="absolute top-[-20px] right-[-20px] w-40 h-40 transform rotate-12 pointer-events-none">
        <img src="/images/logo.png" class="w-full h-full object-contain brightness-0 invert opacity-10">
      </div>
      
      <div class="relative z-10 flex justify-center mb-4">
        <div class="w-16 h-16 bg-white rounded-full p-1 shadow-lg">
          <img src="/images/logo.png" alt="Logo" class="w-full h-full object-contain">
        </div>
      </div>
      <h2 class="text-2xl font-black text-white tracking-tight">LOGIN PORTAL</h2>
      <p class="text-blue-200 text-sm font-medium mt-1">Akses masuk Coach dan Wali Murid</p>
    </div>

    <!-- Form Login -->
    <div class="p-8 pt-6">
      <div id="errorMsg" class="hidden bg-red-50 text-red-600 text-sm font-semibold p-3 rounded-xl mb-4 border border-red-100 text-center">
        Username atau Password salah!
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-slate-700 text-xs font-bold mb-2 uppercase tracking-wide">Username</label>
          <input type="text" id="username" required placeholder="Masukkan username"
            class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
        </div>

        <div>
          <label class="block text-slate-700 text-xs font-bold mb-2 uppercase tracking-wide">Password</label>
          <input type="password" id="password" required placeholder="••••••••"
            class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
        </div>

        <button type="submit" id="submitBtn" 
          class="w-full bg-blue-600 text-white font-bold text-sm uppercase tracking-wider py-4 rounded-xl shadow-lg shadow-blue-500/30 hover:bg-blue-700 active:scale-95 transition-all mt-4">
          Login Sekarang
        </button>
      </form>
      
      <div class="mt-6 text-center">
        <a href="index.html" class="text-slate-400 hover:text-slate-600 text-sm font-medium transition-colors">
          &larr; Kembali ke Beranda
        </a>
      </div>
    </div>
  </div>

  <!-- LOGIKA SUPABASE & MULTI-ROLE -->
  <script type="module">
    import { supabase } from '/src/supabase.js';

    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault(); 
      
      submitBtn.innerHTML = 'Memeriksa...';
      submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
      errorMsg.classList.add('hidden');

      const userVal = document.getElementById('username').value;
      const passVal = document.getElementById('password').value;

      try {
        const { data, error } = await supabase
          .from('users')
          .select('*')
          .eq('username', userVal)
          .eq('password', passVal)
          .single(); 

        if (error || !data) throw new Error('Gagal login');

        // Simpan sesi global
        localStorage.setItem('logged_in', 'true');
        localStorage.setItem('user_name', data.username);
        localStorage.setItem('user_role', data.role); // Simpan role-nya
        
        // Redirect berdasarkan role
        if (data.role === 'coach') {
            window.location.href = 'coach.html';
        } else if (data.role === 'parent') {
            window.location.href = 'parent.html';
        } else {
            alert("Role tidak dikenali!");
            submitBtn.innerHTML = 'Login Sekarang';
            submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        }

      } catch (err) {
        errorMsg.classList.remove('hidden');
        submitBtn.innerHTML = 'Login Sekarang';
        submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
      }
    });
  </script>
</body>
</html>
