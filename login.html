<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login Portal - AVIANDO</title>
  
  <!-- Memanggil style.css milikmu yang sudah ada di root -->
  <link rel="stylesheet" href="/style.css">
  
  <style>
    /* Hanya menambahkan modifikasi gaya khusus untuk form di dalam kontainer */
    .form-box {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
      margin-top: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 700;
      color: #172554;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-size: 13px;
      color: #1f2937;
      background-color: #f9fafb;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: #f97316;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
    }

    .alert-error {
      color: #dc2626;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .btn-back {
      display: inline-block;
      margin-top: 16px;
      color: #172554;
      font-size: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    .btn-back:hover {
      color: #f97316;
    }
  </style>
</head>
<body>

  <!-- Menggunakan susunan class bawaan style.css milikmu -->
  <div class="app-container">
    
    <!-- BAGIAN ATAS -->
    <div class="top-section">
      
      <!-- Lingkaran Logo ACS -->
      <div class="logo-wrapper">
        <img src="/images/logo.png" alt="Logo AVIANDO" class="logo-img">
      </div>
      
      <!-- Judul Identitas Halaman -->
      <h1 class="title-main" style="font-size: 22px;">LOGIN PORTAL</h1>
      <p class="title-sub" style="margin-bottom: 4px;">Portal Log In: Collector, Admin, & Owner AVIANDO</p>
      
      <!-- Box Form Pembungkus -->
      <div class="form-box">
        <!-- Notifikasi Pesan Error -->
        <div id="errorMsg" class="alert-error hidden">Username atau password salah!</div>

        <form id="loginForm">
          <!-- Input Username / Email -->
          <div class="form-group">
            <label for="username">Username / Email</label>
            <input type="text" id="username" class="form-input" placeholder="Masukkan username atau email" required>
          </div>
          
          <!-- Input Password -->
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Masukkan password" required>
          </div>
          
          <!-- Tombol Eksekusi Kirim Data -->
          <button type="submit" id="submitBtn" class="btn-login" style="margin-bottom: 0;">
            Login Sekarang
          </button>
        </form>
      </div>

      <!-- Navigasi Kembali Ke Beranda Depan -->
      <a href="/index.html" class="btn-back">← Kembali ke Beranda</a>
      
    </div>

    <!-- BAGIAN BAWAH -->
    <div class="bottom-section">
      <div class="footer">
        <img src="/images/logo.png" alt="Logo Footer" class="footer-logo">
        <p class="footer-title">AVIANDO COLLECTOR SYSTEM</p>
        <p class="developer-text">Developed by <span>ADITYA WEB-DEV</span></p>
        <p>© 2026 All Rights Reserved.</p>
      </div>
    </div>

  </div>

  <!-- Logika Operasional Autentikasi Menggunakan Struktur JavaScript Mentahmu -->
  <script type="module">
    import { supabase } from '/src/supabase.js';

    document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');
      
      btn.innerText = "Memeriksa...";
      btn.disabled = true;
      errorMsg.classList.add('hidden');

      const username = document.getElementById('username').value;
      // Konversi otomatis string login jika bukan email asli
      const targetEmail = username.includes('@') ? username : username + '@aviando.local';

      try {
        // Melakukan validasi pencocokan akun ke database Supabase
        const { data, error } = await supabase
          .from('users')
          .select('*')
          .eq('email', targetEmail)
          .single();

        if (error || !data) {
          throw new Error("Kredensial tidak ditemukan.");
        }

        // Perekaman Sesi Akses ke Penyimpanan Lokal Browser (Session)
        localStorage.setItem('logged_in', 'true');
        localStorage.setItem('user_id', data.id);
        localStorage.setItem('user_name', data.name);
        localStorage.setItem('user_role', data.role);

        // Pengalihan Halaman Berdasarkan Tingkatan Akses Pengguna
        if (data.role === 'admin') window.location.href = 'admin.html';
        else if (data.role === 'owner') window.location.href = 'owner.html';
        else if (data.role === 'collector') window.location.href = 'collector.html';
        else throw new Error("Role tidak dikenali.");

      } catch (err) {
        errorMsg.innerText = "Username atau password salah!";
        errorMsg.classList.remove('hidden');
        console.error(err);
      } finally {
        btn.innerText = "Login Sekarang";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
