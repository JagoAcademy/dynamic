<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - AVIANDO COLLECTOR SYSTEM</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* JURUS PENGHILANG SCROLLBAR & EFEK SAMARAN HP */
    body, html {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #0B1B3D;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden !important;
    }

    .app-container {
      width: 100%;
      max-width: 480px; 
      height: 100vh;
      background: linear-gradient(180deg, #0B1B3D 0%, #163063 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      
      overflow-y: auto;
      -ms-overflow-style: none !important;
      scrollbar-width: none !important; 
    }

    .app-container::-webkit-scrollbar {
      display: none !important;
      width: 0px !important;
      background: transparent !important;
    }

    @media (min-width: 481px) {
      .app-container {
        height: 90vh;
        max-height: 850px;
        border-radius: 36px;
        border: 12px solid #000000;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      }
    }
  </style>
</head>
<body>

  <!-- BINGKAI LAYAR HP -->
  <div class="app-container">
    
    <!-- BAGIAN ATAS: Logo & Judul -->
    <div class="flex flex-col items-center justify-center pt-16 pb-6 px-6 text-center">
      <div class="bg-white p-3 rounded-full shadow-[0_0_15px_rgba(255,255,255,0.2)] mb-5">
        <img src="/images/logo.png" alt="Logo ACS" class="w-20 h-20 object-contain">
      </div>
      <h1 class="text-2xl font-black text-white uppercase tracking-wider mb-2">Login Portal</h1>
      <p class="text-[10px] font-bold text-orange-400 uppercase tracking-widest px-4 leading-relaxed">
        Portal Log In: Collector, Admin, & Owner Aviando
      </p>
    </div>

    <!-- BAGIAN TENGAH: Form Login -->
    <div class="px-6 flex-1 w-full flex flex-col justify-center">
      <div class="bg-white/95 backdrop-blur-md rounded-[24px] p-6 shadow-2xl border border-white/20">
        
        <!-- ELEMENT PESAN ERROR (Wajib ada buat nyambung ke login.js) -->
        <div id="errorMsg" class="hidden mb-4 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-xs font-bold text-center"></div>

        <!-- FORM ID HARUS "loginForm" BUKAN "formLogin" -->
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Username</label>
            <input type="text" id="username" required placeholder="Masukkan username" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500 outline-none transition-all placeholder:text-slate-300 font-medium">
          </div>
          
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Password</label>
            <input type="password" id="password" required placeholder="Masukkan password" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500 outline-none transition-all placeholder:text-slate-300 font-medium">
          </div>

          <!-- BUTTON ID HARUS ADA "submitBtn" -->
          <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-[#E65C00] to-orange-500 text-white font-bold text-sm py-4 rounded-xl mt-2 active:scale-95 transition-all shadow-[0_8px_20px_rgba(230,92,0,0.3)] hover:shadow-[0_8px_20px_rgba(230,92,0,0.5)]">
            Login Sekarang
          </button>
        </form>

        <div class="mt-6 text-center">
          <a href="/index.html" class="text-[11px] font-bold text-slate-400 hover:text-orange-500 transition-colors tracking-wide">
            &larr; Kembali ke Beranda
          </a>
        </div>
        
      </div>
    </div>

    <!-- BAGIAN BAWAH: Footer -->
    <div class="py-6 flex flex-col items-center justify-center opacity-50 mt-auto">
      <img src="/images/logo.png" alt="Footer Logo" class="w-6 h-6 grayscale mb-2 opacity-70">
      <p class="text-[9px] font-black text-white uppercase tracking-[0.2em] mb-1">Aviando Collector System</p>
      <p class="text-[8px] font-medium text-slate-300 tracking-wider">Developed by ADITYA WEB-DEV</p>
    </div>

  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
