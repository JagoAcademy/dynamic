<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <!-- Meta Viewport untuk Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Login Portal - ACS</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0B1B3D; }
    .bg-gradient-custom { background: linear-gradient(135deg, #0B1B3D 0%, #1A3673 100%); }
    
    /* Mencegah zoom di iOS saat input focus */
    input[type="text"], input[type="password"] { font-size: 16px; } 
  </style>
</head>
<body class="bg-gradient-custom min-h-screen flex flex-col justify-between text-white selection:bg-[#E65C00] selection:text-white relative">

  <!-- Loading Overlay -->
  <div id="loading" class="fixed inset-0 bg-slate-900/80 z-50 hidden flex-col items-center justify-center backdrop-blur-sm">
    <div class="w-12 h-12 border-4 border-slate-300 border-t-[#E65C00] rounded-full animate-spin mb-3"></div>
    <p class="text-xs font-bold text-white tracking-widest uppercase animate-pulse">Memproses...</p>
  </div>

  <!-- Bagian Atas: Header -->
  <main class="flex-1 flex flex-col items-center justify-center px-6 pt-12 pb-8">
    
    <!-- Wadah Logo (Bisa diklik kembali ke index) -->
    <a href="index.html" class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl shadow-xl overflow-hidden mb-5 transition-transform hover:scale-105 active:scale-95 block">
        <!-- Logo fit in penuh -->
        <img src="/images/logo.png" alt="Logo ACS" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150/000000/FFFFFF?text=ACS'">
    </a>

    <!-- Judul Halaman -->
    <div class="text-center mb-4">
      <h1 class="text-2xl sm:text-3xl font-black mb-1.5 tracking-tight">Portal Login</h1>
      <p class="text-[#f97316] text-[10px] sm:text-[11px] font-black uppercase tracking-[0.15em]">Collector, Admin, & Owner</p>
    </div>

  </main>

  <!-- Bagian Bawah: Form Login (Warna Putih) -->
  <footer class="bg-white text-slate-800 rounded-t-[2.5rem] w-full max-w-md mx-auto p-8 shadow-[0_-10px_40px_rgba(0,0,0,0.2)]">
      
      <!-- Notifikasi Error -->
      <div id="error-msg" class="hidden mb-4 bg-red-50 border border-red-200 text-red-600 text-[11px] font-bold px-4 py-3 rounded-xl text-center">
          Username atau password salah!
      </div>

      <!-- Form Input -->
      <form id="loginForm" class="space-y-4">
        
        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Username</label>
          <input type="text" id="username" required placeholder="Masukkan username" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm font-semibold text-slate-700 focus:ring-2 focus:ring-[#E65C00] focus:bg-white outline-none transition-all shadow-inner">
        </div>
        
        <div class="mb-6">
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Password</label>
          <input type="password" id="password" required placeholder="Masukkan password" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm font-semibold text-slate-700 focus:ring-2 focus:ring-[#E65C00] focus:bg-white outline-none transition-all shadow-inner">
        </div>

        <button type="submit" class="w-full bg-[#E65C00] hover:bg-orange-600 text-white font-black text-xs sm:text-sm py-4 rounded-xl uppercase tracking-widest transition-all active:scale-95 shadow-[0_8px_20px_rgba(230,92,0,0.25)] mb-4">
          Login Sekarang
        </button>

      </form>

      <!-- Tombol Kembali -->
      <div class="text-center mb-6">
         <a href="index.html" class="text-[11px] font-bold text-slate-400 hover:text-[#0B1B3D] transition-colors">
            &larr; Kembali ke Beranda
         </a>
      </div>

      <!-- Footer Info -->
      <div class="text-center flex flex-col items-center">
        <!-- Logo Kecil Abu-abu (Bisa diklik) -->
        <a href="index.html" class="w-10 h-10 mb-3 opacity-30 grayscale hover:grayscale-0 hover:opacity-100 transition-all block">
           <img src="/images/logo.png" alt="Logo Footer" class="w-full h-full object-cover rounded-md" onerror="this.src='https://via.placeholder.com/40'">
        </a>
        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Aviando Collector System</p>
        <p class="text-[8px] font-bold text-slate-300 mt-1">Developed by PT. TPI</p>
      </div>

  </footer>

  <!-- Script Login (Supabase) -->
  <script type="module" src="/src/login.js"></script>

</body>
</html>
