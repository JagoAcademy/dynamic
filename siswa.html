<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Atlet - Dynamic Club</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center antialiased">

  <div class="w-full max-w-md bg-slate-50 min-h-screen shadow-2xl relative pb-10">
    
    <!-- Header -->
    <div class="bg-gradient-to-br from-blue-800 to-blue-600 px-6 pt-10 pb-8 rounded-b-[2.5rem] shadow-lg text-white mb-6 relative overflow-hidden">
      <div class="absolute top-[-20px] right-[-20px] w-40 h-40 transform rotate-12 pointer-events-none">
        <img src="/images/logo.png" class="w-full h-full object-contain brightness-0 invert opacity-10">
      </div>
      
      <div class="relative z-10 flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-black tracking-tight mb-1">ATLET REGULER</h1>
          <p class="text-blue-200 text-sm font-medium">Database Dynamic Aquatic Club</p>
        </div>
        <button onclick="window.location.href='index.html'" class="bg-white/20 p-2 rounded-full backdrop-blur-sm active:scale-95 transition-transform">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </button>
      </div>
    </div>

    <!-- Search/Filter (Opsional buat ke depannya) -->
    <div class="px-5 mb-4">
        <input type="text" id="search-murid" placeholder="Cari nama atlet..." 
            class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"
            onkeyup="filterSiswa()">
    </div>

    <!-- Container List Siswa -->
    <div id="student-list" class="px-5">
      <div class="flex justify-center items-center py-10">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        <span class="ml-3 text-slate-500 font-semibold text-sm">Menarik data dari kolam...</span>
      </div>
    </div>

  </div>

  <!-- LOGIKA SUPABASE & RENDER -->
  <script type="module">
    import { supabase } from '/src/supabase.js';

    async function fetchSiswa() {
      const container = document.getElementById('student-list');

      try {
        const { data, error } = await supabase
          .from('siswa')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (data.length === 0) {
          container.innerHTML = `
            <div class="text-center py-10 bg-white rounded-2xl border border-slate-100 shadow-sm">
              <p class="text-4xl mb-3">🏊‍♂️</p>
              <p class="text-slate-500 font-bold text-sm">Belum ada data atlet.</p>
            </div>
          `;
          return;
        }

        // Mapping layout EXACTLY seperti Jago Renang (siswa.js)
        container.innerHTML = data.map(siswa => {
          // Format Tanggal (YYYY-MM-DD ke DD/MM/YYYY)
          let tglIndo = siswa.tanggal_lahir ? siswa.tanggal_lahir.split('-').reverse().join('/') : '-';
          
          // Rapihin nomor WA (Mastiin format 62 buat link)
          let waClean = siswa.no_wa ? siswa.no_wa.replace(/\\D/g, '') : '';
          if (waClean.startsWith('0')) waClean = '62' + waClean.substring(1);
          let linkWA = waClean ? \`https://wa.me/\${waClean}\` : '#';

          return \`
            <div class="siswa-item flex justify-between items-center bg-white border border-slate-200 rounded-xl p-3.5 mb-3 shadow-[0_2px_4px_rgba(0,0,0,0.02)] box-border">
                
                <!-- KIRI: Informasi Detail -->
                <div class="flex-1 pr-4 min-w-0">
                    <div class="flex items-center gap-1.5 flex-wrap mb-1">
                        <strong class="nama-siswa text-sky-600 text-[15px] font-bold break-words uppercase">\${siswa.nama_lengkap}</strong> 
                        <span class="bg-emerald-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold whitespace-nowrap">Aktif</span>
                    </div>
                    <div class="text-[12px] text-slate-700 leading-relaxed">
                        <span>📅 Lahir: \${tglIndo} | <b class="text-sky-600">\${siswa.kelompok_umur}</b></span><br>
                        <span class="text-sky-700 font-bold">🏊 Program Reguler Dynamic</span><br>
                        <span class="text-amber-500 text-[11px] font-bold">📱 WA: \${siswa.no_wa || '-'}</span>
                    </div>
                </div>

                <!-- KANAN: Tombol Aksi -->
                <div class="flex flex-col gap-1.5 w-[110px] shrink-0 box-border">
                    <a href="\${linkWA}" target="_blank" class="flex items-center justify-center gap-1 h-8 text-[11px] bg-emerald-500 text-white rounded-md font-bold w-full transition-colors active:scale-95">
                        💬 Chat WA
                    </a>
                    <button class="flex items-center justify-center gap-1 h-8 text-[11px] bg-amber-500 text-white rounded-md font-bold w-full transition-colors active:scale-95">
                        ✏️ Edit Data
                    </button>
                </div>

            </div>
          \`;
        }).join('');

      } catch (err) {
        container.innerHTML = \`
          <div class="bg-red-50 text-red-600 p-4 rounded-xl border border-red-100 text-sm font-semibold">
            Gagal memuat data: \${err.message}
          </div>
        \`;
      }
    }

    // Eksekusi load data
    fetchSiswa();

    // Fungsi Filter/Search (di-export ke window biar bisa dipanggil dari input HTML)
    window.filterSiswa = function() {
        const input = document.getElementById('search-murid').value.toLowerCase();
        const items = document.querySelectorAll('.siswa-item');
        items.forEach(item => {
            const nama = item.querySelector('.nama-siswa').innerText.toLowerCase();
            item.style.display = nama.includes(input) ? "flex" : "none";
        });
    }
  </script>
</body>
</html>
