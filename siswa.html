<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Atlet - Dynamic Club</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center antialiased">

  <div class="w-full max-w-md bg-slate-50 min-h-screen shadow-2xl relative pb-10">
    
    <!-- Header -->
    <div class="bg-gradient-to-br from-blue-800 to-blue-600 px-6 pt-10 pb-8 rounded-b-[2.5rem] shadow-lg text-white mb-6 relative overflow-hidden">
      <!-- Watermark -->
      <div class="absolute top-[-20px] right-[-20px] w-40 h-40 transform rotate-12 pointer-events-none">
        <img src="/images/logo.png" class="w-full h-full object-contain brightness-0 invert opacity-10">
      </div>
      
      <div class="relative z-10 flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-black tracking-tight mb-1">ATLET REGULER</h1>
          <p class="text-blue-200 text-sm font-medium">Database Dynamic Aquatic Club</p>
        </div>
        <!-- Tombol Back ke Home -->
        <button onclick="window.location.href='index.html'" class="bg-white/20 p-2 rounded-full backdrop-blur-sm active:scale-95 transition-transform">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </button>
      </div>
    </div>

    <!-- Container List Siswa -->
    <div id="student-list" class="px-5 space-y-4">
      <!-- Teks loading awal sebelum data ditarik dari Supabase -->
      <div class="flex justify-center items-center py-10">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        <span class="ml-3 text-slate-500 font-semibold text-sm">Menarik data dari kolam...</span>
      </div>
    </div>

  </div>

  <!-- LOGIKA SUPABASE -->
  <script type="module">
    import { supabase } from '/src/supabase.js';

    async function fetchSiswa() {
      const container = document.getElementById('student-list');

      try {
        // Ambil semua data dari tabel 'siswa', urutkan dari yang paling baru diinput
        const { data, error } = await supabase
          .from('siswa')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        // Kalau datanya masih kosong
        if (data.length === 0) {
          container.innerHTML = `
            <div class="text-center py-10 bg-white rounded-2xl border border-slate-100 shadow-sm">
              <p class="text-4xl mb-3">🏊‍♂️</p>
              <p class="text-slate-500 font-bold text-sm">Belum ada data atlet.</p>
            </div>
          `;
          return;
        }

        // Kalau ada datanya, looping jadi Card HTML
        container.innerHTML = data.map(siswa => `
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-3 hover:shadow-md transition-shadow">
            
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-bold text-slate-800 text-lg uppercase">${siswa.nama_lengkap}</h3>
                <p class="text-[13px] text-slate-500 font-medium mt-0.5">Tgl Lahir: <span class="text-slate-700 font-semibold">${siswa.tanggal_lahir}</span></p>
              </div>
              <span class="bg-blue-50 border border-blue-100 text-blue-700 text-[10px] font-black uppercase px-2.5 py-1.5 rounded-lg whitespace-nowrap ml-2 shadow-sm">
                ${siswa.kelompok_umur}
              </span>
            </div>
            
            <div class="pt-3 border-t border-slate-100 flex justify-between items-center mt-1">
              <div class="text-xs font-bold text-slate-400 uppercase tracking-wide">
                No. WA: <span class="text-slate-700">${siswa.no_wa}</span>
              </div>
              
              <!-- Tombol klik langsung masuk WhatsApp -->
              <a href="https://wa.me/${siswa.no_wa}" target="_blank" class="bg-green-50 text-green-600 p-2 rounded-xl hover:bg-green-100 active:scale-95 transition-all border border-green-100 shadow-sm">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
                </svg>
              </a>
            </div>
            
          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = `
          <div class="bg-red-50 text-red-600 p-4 rounded-xl border border-red-100 text-sm font-semibold">
            Gagal memuat data: ${err.message}
          </div>
        `;
      }
    }

    // Eksekusi fungsi saat halaman dimuat
    fetchSiswa();
  </script>
</body>
</html>
