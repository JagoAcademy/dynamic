<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parent Portal - DAC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center antialiased">

  <div class="w-full max-w-md bg-slate-50 min-h-screen shadow-2xl relative pb-10">
    
    <!-- Header Parent (Warna Hijau Tosca biar beda sama Coach) -->
    <div class="bg-gradient-to-br from-teal-700 to-teal-500 px-6 pt-10 pb-8 rounded-b-[2.5rem] shadow-lg text-white mb-6 relative overflow-hidden">
      <div class="absolute top-[-20px] right-[-20px] w-40 h-40 transform rotate-12 pointer-events-none">
        <img src="/images/logo.png" class="w-full h-full object-contain brightness-0 invert opacity-10">
      </div>
      
      <div class="relative z-10 flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-black tracking-tight mb-1">PARENT PORTAL</h1>
          <p class="text-teal-100 text-sm font-medium" id="welcomeParent">Halo, Ayah/Bunda!</p>
        </div>
        <button onclick="logout()" class="bg-white/20 p-2 text-xs font-bold rounded-full backdrop-blur-sm active:scale-95 transition-transform border border-teal-400/50">
          LOGOUT
        </button>
      </div>
    </div>

    <!-- Konten Dummy Parent -->
    <div class="px-5 space-y-4">
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center">
            <span class="text-4xl mb-2 block">👨‍👩‍👦</span>
            <h3 class="font-bold text-slate-800">Selamat Datang di Portal Wali</h3>
            <p class="text-sm text-slate-500 mt-1">Fitur rapor anak dan tagihan akan segera hadir di sini.</p>
        </div>
    </div>

  </div>

  <script>
    // Proteksi halaman khusus Parent
    if (localStorage.getItem('logged_in') !== 'true' || localStorage.getItem('user_role') !== 'parent') {
      window.location.href = 'login.html'; 
    } else {
      document.getElementById('welcomeParent').innerText = `Halo, ${localStorage.getItem('user_name')}!`;
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
