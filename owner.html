<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Portal - AVIANDO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center">
  <div class="w-full max-w-md md:max-w-2xl lg:max-w-4xl bg-white min-h-screen shadow-2xl relative pb-20 transition-all duration-300">
    <div class="bg-gradient-to-br from-slate-900 to-black px-6 md:px-10 pt-10 pb-6 rounded-b-[2rem] shadow-lg text-white">
      <div class="flex justify-between items-center mb-2">
        <h1 class="text-2xl font-black tracking-tight text-yellow-500 drop-shadow-sm">OWNER PORTAL</h1>
        <button id="logoutBtn" class="bg-red-500/20 text-red-100 text-xs font-bold px-3 py-1.5 rounded-full border border-red-400/30 active:scale-95">LOGOUT</button>
      </div>
      <p class="text-slate-300 text-sm font-medium" id="welcomeOwner">Halo, Director / Owner!</p>
    </div>
    <div class="p-6 md:p-10 space-y-4">
      <h2 class="text-sm font-black text-slate-800 uppercase mb-2">Ringkasan Eksekutif</h2>
      <div class="grid grid-cols-2 gap-4 lg:gap-6">
        <div class="bg-blue-50 border border-blue-100 p-6 rounded-2xl text-center shadow-sm">
          <span class="text-3xl mb-2 block">📁</span>
          <h3 class="text-xs font-bold text-blue-500 uppercase tracking-wider mb-1">Total Debitur / Kasus Aktif</h3>
          <p id="val-total-kasus" class="text-2xl md:text-3xl font-black text-blue-900">0 Kasus</p>
        </div>
        <div class="bg-orange-50 border border-orange-100 p-6 rounded-2xl text-center shadow-sm">
          <span class="text-3xl mb-2 block">💰</span>
          <h3 class="text-xs font-bold text-orange-500 uppercase tracking-wider mb-1">Total Recovery / Dana Tertagih</h3>
          <p id="val-total-recovery" class="text-2xl md:text-3xl font-black text-orange-900">Rp 0</p>
        </div>
      </div>
      <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm text-center mt-6">
        <span class="text-5xl mb-3 block">📈</span>
        <h3 class="font-bold text-slate-800 text-lg">Performa Tim Collector</h3>
        <p class="text-sm text-slate-500 mt-2">Data performa individu collector akan segera diintegrasikan.</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/owner.js"></script>
</body>
</html>
