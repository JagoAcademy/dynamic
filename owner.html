<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Portal - AVIANDO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen">
  
  <!-- HEADER FULL WIDTH -->
  <nav class="w-full bg-gradient-to-r from-slate-900 to-black px-6 lg:px-12 py-5 shadow-lg text-white sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <img src="/images/logo.png" class="w-10 h-10 lg:w-12 lg:h-12 bg-white p-1.5 rounded-full shadow-md object-contain">
      <div>
        <h1 class="text-lg lg:text-xl font-black tracking-tight text-yellow-500 uppercase">Owner Portal</h1>
        <p class="text-slate-300 text-[11px] lg:text-xs font-medium" id="welcomeOwner">Halo, Director / Owner!</p>
      </div>
    </div>
    <button id="logoutBtn" class="bg-red-500/20 text-red-100 text-xs font-bold px-4 py-2 rounded-full border border-red-400/30 hover:bg-red-500 hover:text-white transition-all active:scale-95">LOGOUT</button>
  </nav>

  <!-- MAIN WORKSPACE -->
  <main class="max-w-7xl mx-auto p-6 lg:p-10 w-full space-y-8">
    
    <div>
      <h2 class="text-sm font-black text-slate-800 uppercase mb-4">Ringkasan Eksekutif</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-blue-50 border border-blue-100 p-8 rounded-2xl shadow-sm flex flex-col justify-center">
          <span class="text-4xl mb-4">📁</span>
          <h3 class="text-sm font-bold text-blue-500 uppercase tracking-wider mb-2">Total Debitur / Kasus Aktif</h3>
          <p id="val-total-kasus" class="text-3xl md:text-4xl font-black text-blue-900">0 Kasus</p>
        </div>
        <div class="bg-orange-50 border border-orange-100 p-8 rounded-2xl shadow-sm flex flex-col justify-center">
          <span class="text-4xl mb-4">💰</span>
          <h3 class="text-sm font-bold text-orange-500 uppercase tracking-wider mb-2">Total Recovery / Dana Tertagih</h3>
          <p id="val-total-recovery" class="text-3xl md:text-4xl font-black text-orange-900">Rp 0</p>
        </div>
      </div>
    </div>

    <div class="bg-white p-10 rounded-2xl border border-slate-200 shadow-sm text-center">
      <span class="text-5xl mb-4 block">📈</span>
      <h3 class="font-bold text-slate-800 text-xl mb-2">Performa Tim Collector</h3>
      <p class="text-base text-slate-500 max-w-lg mx-auto">Sistem analitik grafik dan data performa individu collector akan segera diintegrasikan di panel ini.</p>
    </div>
    
  </main>
  
  <script type="module" src="/src/owner.js"></script>
</body>
</html>
